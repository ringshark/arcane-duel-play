<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcane Duel</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0820; font-family: "Segoe UI", system-ui, sans-serif; color: #fff; user-select: none; }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }

  .bar-wrap { position: absolute; top: 18px; width: 340px; }
  .bar-wrap.left { left: 24px; }
  .bar-wrap.right { right: 24px; text-align: right; }
  .bar-wrap .name { font-weight: 700; letter-spacing: 1px; text-shadow: 0 2px 4px #000; margin-bottom: 4px; }
  .bar { position: relative; height: 22px; background: rgba(0,0,0,.6); border: 2px solid rgba(255,255,255,.25); border-radius: 4px; overflow: hidden; }
  .bar .fill { height: 100%; background: linear-gradient(#e0405a, #8e1b30); transition: width .15s; }
  .bar .fill.enemy { background: linear-gradient(#7a6bff, #3a2a9e); margin-left: auto; }
  .bar.sm { height: 15px; margin-top: 4px; }
  .bar.sm span { font-size: 11px; }
  .bar .fill.mana { background: linear-gradient(#4aa8ff, #1a4f9e); }
  .bar .fill.stam { background: linear-gradient(#e6d84a, #8a7a12); }
  .bar .fill.shieldhp { background: linear-gradient(#b8875a, #5e3e22); }
  .bar .fill.shieldhp.low { background: linear-gradient(#e0603a, #7a2a12); }
  .bar .fill.r { margin-left: auto; }
  .bar span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; text-shadow: 0 1px 2px #000; }

  #crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  #crosshair i { position: absolute; background: #fff; box-shadow: 0 0 2px #000; }
  #crosshair i:nth-child(1) { width: 2px; height: 8px; left: -1px; top: -14px; }
  #crosshair i:nth-child(2) { width: 2px; height: 8px; left: -1px; top: 6px; }
  #crosshair i:nth-child(3) { width: 8px; height: 2px; left: -14px; top: -1px; }
  #crosshair i:nth-child(4) { width: 8px; height: 2px; left: 6px; top: -1px; }
  #crosshair b { position: absolute; width: 4px; height: 4px; left: -2px; top: -2px; border-radius: 50%; background: #fff; box-shadow: 0 0 2px #000; }
  #hitmarker { position: absolute; left: 50%; top: 50%; width: 0; height: 0; opacity: 0; transition: opacity .15s; }
  #hitmarker i { position: absolute; width: 2px; height: 9px; background: #fff; left: -1px; top: -4px; }
  #hitmarker i:nth-child(1) { transform: rotate(45deg) translateY(-11px); }
  #hitmarker i:nth-child(2) { transform: rotate(135deg) translateY(-11px); }
  #hitmarker i:nth-child(3) { transform: rotate(225deg) translateY(-11px); }
  #hitmarker i:nth-child(4) { transform: rotate(315deg) translateY(-11px); }
  #hitmarker.show { opacity: 1; transition: none; }
  #hitmarker.head i { background: #ff3b3b; height: 12px; }

  #castbar { position: absolute; left: 50%; bottom: 170px; width: 320px; margin-left: -160px; height: 18px; background: rgba(0,0,0,.6); border: 2px solid rgba(255,255,255,.3); border-radius: 4px; overflow: hidden; display: none; }
  #castFill { height: 100%; width: 0; background: linear-gradient(90deg, #ff8a2a, #ffd27a); }
  #castLabel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; text-shadow: 0 1px 2px #000; }
  #readyMsg { position: absolute; left: 50%; top: calc(50% + 40px); transform: translateX(-50%); font-weight: 800; font-size: 15px; letter-spacing: 1px; text-shadow: 0 0 8px currentColor, 0 2px 3px #000; white-space: nowrap; }
  #toast { position: absolute; left: 50%; top: calc(50% + 66px); transform: translateX(-50%); font-size: 13px; color: #ffb4b4; text-shadow: 0 1px 2px #000; opacity: 0; transition: opacity .3s; }

  #slots { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 10px; }
  .slot { position: relative; width: 66px; height: 62px; background: rgba(10,8,25,.75); border: 2px solid rgba(255,255,255,.25); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .slot .icon { font-size: 20px; line-height: 1; margin-top: 6px; }
  .slot .label { font-size: 11px; font-weight: 700; margin-top: 4px; }
  .slot .key { position: absolute; top: 3px; left: 6px; font-size: 11px; font-weight: 800; color: #ffd66b; }
  .slot .cd { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0,0,0,.7); }
  .slot .cdText { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; text-shadow: 0 2px 3px #000; }
  .slot.active { border-color: #ffd66b; box-shadow: 0 0 14px #ffd66b; }
  .slot.denied { border-color: #ff4a4a; }

  /* Quick use bar: 10 item squares above the ability bar */
  #items { position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%); display: flex; gap: 6px; }
  .item { position: relative; width: 46px; height: 46px; background: rgba(10,8,25,.6); border: 2px solid rgba(255,255,255,.18); border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .item .key { position: absolute; top: 2px; left: 4px; font-size: 10px; font-weight: 800; color: #ffd66b; }
  .item .icon { font-size: 22px; line-height: 1; }
  .item .count { position: absolute; right: 4px; bottom: 2px; font-size: 11px; font-weight: 800; text-shadow: 0 1px 2px #000; }
  .item.filled { background: rgba(10,8,25,.8); border-color: rgba(255,255,255,.35); }
  .item.used { border-color: #ffd66b; box-shadow: 0 0 10px #ffd66b; }
  .item.denied { border-color: #ff4a4a; }
  .item.drinking { border-color: #ffd66b; box-shadow: 0 0 10px #ffd66b; }
  .item { overflow: hidden; }
  .item .cd { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0,0,0,.7); }
  .item .cdText { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; text-shadow: 0 2px 3px #000; }

  #help { position: absolute; left: 24px; bottom: 24px; font-size: 12px; line-height: 1.6; color: rgba(255,255,255,.75); text-shadow: 0 1px 2px #000; }
  #help b { color: #ffd66b; }
  #botStatus { position: absolute; right: 24px; bottom: 24px; font-size: 12px; color: rgba(255,255,255,.75); text-shadow: 0 1px 2px #000; text-align: right; line-height: 1.6; }
  #banner { position: absolute; left: 50%; top: 28%; transform: translate(-50%, -50%); font-size: 72px; font-weight: 900; letter-spacing: 4px; text-shadow: 0 0 20px #7a5cff, 0 4px 6px #000; opacity: 0; }

  #nameplate { position: absolute; left: 0; top: 0; width: 120px; text-align: center; font-size: 12px; font-weight: 700; text-shadow: 0 1px 2px #000; }
  #nameplate div { height: 6px; background: rgba(0,0,0,.6); margin-top: 2px; border-radius: 3px; overflow: hidden; }
  #nameplate i { display: block; height: 100%; background: #8a7bff; }

  #vignette { position: absolute; inset: 0; box-shadow: inset 0 0 160px 40px rgba(255,0,0,.8); opacity: 0; }
  #floaters { position: absolute; inset: 0; }
  .floater { position: absolute; left: 0; top: 0; font-weight: 900; font-size: 22px; text-shadow: 0 2px 3px #000, 0 0 6px #000; white-space: nowrap; }
  .floater.dmg { color: #fff; }
  .floater.head { color: #ffde3b; font-size: 30px; }
  .floater.taken { color: #ff5a5a; }
  .floater.heal { color: #6bff8f; }
  .floater.mana { color: #6fb8ff; }
  .floater.stam { color: #ff7a6b; }
  .floater.tag { color: #ffde3b; font-size: 14px; letter-spacing: 2px; }

  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8,5,20,.72); }
  #overlay .btns { display: flex; gap: 12px; justify-content: center; margin-top: 18px; }
  #overlay button { font: inherit; font-weight: 700; color: #fff; background: rgba(122,92,255,.25); border: 2px solid rgba(160,130,255,.6); border-radius: 8px; padding: 10px 22px; cursor: pointer; }
  #overlay button:hover { background: rgba(122,92,255,.5); }
  #overlay button.primary { background: #7a5cff; border-color: #a993ff; font-size: 18px; }
  #overlay .settings-scroll { max-height: 52vh; overflow-y: auto; margin: 12px 0; }
  #overlay table.binds td:first-child { color: #cfc6ff; font-weight: 600; }
  #overlay button.bind { min-width: 150px; padding: 5px 12px; font-size: 14px; }
  #overlay button.bind.waiting { background: #ffd66b; color: #1a1030; border-color: #ffd66b; }
  #overlay .sens { margin-top: 8px; color: #cfc6ff; display: flex; gap: 10px; align-items: center; justify-content: center; }
  .slot .energy { position: absolute; left: 6px; right: 6px; bottom: 5px; height: 4px; background: rgba(0,0,0,.6); border-radius: 2px; overflow: hidden; }
  .slot .energy i { display: block; height: 100%; width: 100%; background: #66ccff; }
  #crosshair.free i, #crosshair.free b { background: #ffd66b; }
  .floater.blocked { color: #8fd8ff; font-size: 14px; letter-spacing: 1px; }
  #overlay .panel { text-align: center; max-width: 560px; max-height: 94vh; overflow-y: auto; box-sizing: border-box; padding: 32px 40px; background: rgba(20,14,40,.85); border: 2px solid rgba(160,130,255,.4); border-radius: 12px; }
  #overlay h1 { margin: 0 0 6px; font-size: 48px; letter-spacing: 3px; text-shadow: 0 0 18px #7a5cff; }
  #overlay p { color: #cfc6ff; margin: 6px 0; }
  #overlay table { margin: 16px auto; font-size: 14px; border-collapse: collapse; text-align: left; }
  #overlay td { padding: 3px 12px; }
  #overlay td:first-child { color: #ffd66b; font-weight: 700; text-align: right; }
  #overlay .go { margin-top: 18px; font-size: 20px; font-weight: 800; color: #fff; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .45; } }

  /* Class select */
  #overlay .panel.wide { max-width: 940px; }
  #overlay .playing-as { color: #ffd66b; font-weight: 700; }
  .classes { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin: 18px 0 10px; }
  .ccard { position: relative; width: 196px; padding: 12px 10px 14px; background: rgba(255,255,255,.04); border: 2px solid rgba(160,130,255,.3); border-radius: 12px; cursor: pointer; text-align: center; transition: transform .12s, border-color .12s, box-shadow .12s; }
  .ccard:hover { transform: translateY(-3px); border-color: rgba(190,170,255,.7); }
  .ccard .portrait { height: 240px; display: flex; align-items: flex-end; justify-content: center; background: radial-gradient(ellipse at 50% 80%, rgba(122,92,255,.28), transparent 70%); border-radius: 8px; }
  .ccard img { max-height: 236px; max-width: 100%; object-fit: contain; }
  .ccard h3 { margin: 10px 0 2px; font-size: 19px; letter-spacing: 1px; }
  .ccard .role { color: #b9adff; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .ccard p { font-size: 12.5px; line-height: 1.4; margin: 8px 0 0; }
  .ccard.sel { border-color: #ffd66b; box-shadow: 0 0 18px rgba(255,214,107,.45); }
  .ccard.sel::after { content: 'SELECTED'; position: absolute; top: 10px; left: 10px; font-size: 10px; font-weight: 800; letter-spacing: 1px; color: #1a1030; background: #ffd66b; padding: 2px 7px; border-radius: 4px; }
  .ccard.locked { cursor: not-allowed; }
  .ccard.locked:hover { transform: none; border-color: rgba(160,130,255,.3); }
  .ccard.locked img { filter: grayscale(1) brightness(.55); }
  .ccard.locked h3, .ccard.locked p { opacity: .6; }
  .ccard .soon { position: absolute; top: 10px; right: 10px; font-size: 10px; font-weight: 800; letter-spacing: 1px; color: #fff; background: rgba(90,70,160,.9); padding: 2px 7px; border-radius: 4px; }
  .kit { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 4px auto 0; max-width: 760px; }
  .kit span { font-size: 12.5px; padding: 4px 9px; border-radius: 6px; background: rgba(122,92,255,.18); border: 1px solid rgba(160,130,255,.35); color: #e4dcff; }
  #classNote { min-height: 18px; color: #ffb4b4; font-size: 13px; margin-top: 6px; }
</style>
<script src="sorceress-art.js"></script>
<script src="class-art.js"></script>
<script src="warrior-art.js"></script>

{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }

<body>
<div id="hud">
  <div class="bar-wrap left"><div class="name">YOU</div>
    <div class="bar"><div id="php" class="fill"></div><span id="phpTxt"></span></div>
    <div class="bar sm"><div id="pmp" class="fill mana"></div><span id="pmpTxt"></span></div>
    <div class="bar sm"><div id="psp" class="fill stam"></div><span id="pspTxt"></span></div>
    <div class="bar sm" id="pshWrap" style="display:none"><div id="psh" class="fill shieldhp"></div><span id="pshTxt"></span></div>
  </div>
  <div class="bar-wrap right"><div class="name">RIVAL SORCERESS</div>
    <div class="bar"><div id="ehp" class="fill enemy"></div><span id="ehpTxt"></span></div>
    <div class="bar sm"><div id="emp" class="fill mana r"></div><span id="empTxt"></span></div>
    <div class="bar sm"><div id="esp" class="fill stam r"></div><span id="espTxt"></span></div>
  </div>
  <div id="crosshair"><i></i><i></i><i></i><i></i><b></b></div>
  <div id="hitmarker"><i></i><i></i><i></i><i></i></div>
  <div id="readyMsg"></div>
  <div id="toast"></div>
  <div id="castbar"><div id="castFill"></div><span id="castLabel"></span></div>
  <div id="slots">
    <div class="slot" data-spell="fireball"><span class="key">1</span><span class="icon">🔥</span><span class="label">Fireball</span><div class="cd"></div><div class="cdText"></div></div>
    <div class="slot" data-spell="heal"><span class="key">2</span><span class="icon">✚</span><span class="label">Heal</span><div class="cd"></div><div class="cdText"></div></div>
    <div class="slot" data-spell="lightning"><span class="key">3</span><span class="icon">⚡</span><span class="label">Lightning</span><div class="cd"></div><div class="cdText"></div></div>
    <div class="slot" data-spell="teleport"><span class="key">4</span><span class="icon">🌀</span><span class="label">Teleport</span><div class="cd"></div><div class="cdText"></div></div>
    <div class="slot" data-spell="staff"><span class="key">LMB/F</span><span class="icon">🗡️</span><span class="label">Staff</span><div class="cd"></div><div class="cdText"></div></div>
    <div class="slot" data-spell="shield"><span class="key">Q</span><span class="icon">🛡️</span><span class="label">Shield</span><div class="cd"></div><div class="cdText"></div></div>
    <div class="slot" data-spell="staffBlock"><span class="key">E</span><span class="icon">⚔️</span><span class="label">Staff Block</span><div class="cd"></div><div class="cdText"></div></div>
    <div class="slot" data-spell="clone"><span class="key">T</span><span class="icon">👥</span><span class="label">Clone</span><div class="cd"></div><div class="cdText"></div></div>
    <div class="slot" data-spell="bash" style="display:none"><span class="key">1</span><span class="icon">🛡️</span><span class="label">Shield Bash</span><div class="cd"></div><div class="cdText"></div></div>
    <div class="slot" data-spell="charge" style="display:none"><span class="key">2</span><span class="icon">🐂</span><span class="label">Charge</span><div class="cd"></div><div class="cdText"></div></div>
    <div class="slot" data-spell="warCry" style="display:none"><span class="key">3</span><span class="icon">📯</span><span class="label">War Cry</span><div class="cd"></div><div class="cdText"></div></div>
    <div class="slot" data-spell="whirlwind" style="display:none"><span class="key">4</span><span class="icon">🌪️</span><span class="label">Whirlwind</span><div class="cd"></div><div class="cdText"></div></div>
    <div class="slot" data-spell="throwAxe" style="display:none"><span class="key">Q</span><span class="icon">🪓</span><span class="label">Throw Axe</span><div class="cd"></div><div class="cdText"></div></div>
    <div class="slot" data-spell="gearSword" style="display:none"><span class="key">Y</span><span class="icon">🗡️</span><span class="label">Sheathe</span><div class="cd"></div><div class="cdText"></div></div>
    <div class="slot" data-spell="gearShield" style="display:none"><span class="key">U</span><span class="icon">🛡️</span><span class="label">Stow</span><div class="cd"></div><div class="cdText"></div></div>
  </div>
  <div id="items"></div>
  <div id="help"></div>
  <div id="botStatus"></div>
  <div id="banner"></div>
  <div id="nameplate"><span>Rival Sorceress</span><div><i id="npFill"></i></div></div>
  <div id="vignette"></div>
  <div id="floaters"></div>
</div>
<div id="overlay"><div class="panel" id="overlayPanel"></div></div>

<script type="module">
import * as THREE from 'three';

// ============================================================
// CONFIG — tweak balance here
// ============================================================
const CFG = {
  maxHp: 100,
  maxMana: 100,
  manaRegen: 1,              // mana per second
  maxStamina: 100,
  stamina: {
    movePerSec: 1,           // stamina lost per second while moving
    rollCost: 10,
    regenPerSec: 1 / 3,      // 1 stamina every 3 seconds while moving
    stillRegenPerSec: 5,     // 5 stamina per second while standing still
    exhaustedMult: 0.5,      // move speed at 0 stamina (rolling is impossible)
  },
  moveSpeed: 5.31,           // forward speed (6 → slowed 30% → +10% → +15%)
  avatarScale: 1.5,          // characters drawn (and hit) 50% bigger
  // crouch = squat to half height at half speed. The figure folds: shins, hips/thighs and torso keep these fractions
  // of their standing height (≈ half overall); drop (set at startup) is how far the head comes down
  crouch: { speedMult: 0.5, shin: 0.4, hips: 0.2, torso: 0.82, drop: 0.9 },
  dirSpeed: { forward: 1, back: 0.5, strafe: 0.7 },   // backwards 50%, sideways 70% of forward speed
  castMoveMult: 0.55,      // move speed while casting / holding a charged spell
  jumpVel: 7.5,
  gravity: 22,
  rollSpeed: 13.8,           // +15%
  rollTime: 0.45,
  rollCooldown: 0.8,
  charRadius: 0.6,           // body radius for collisions (scaled with the bigger avatars)
  arenaRadius: 34,
  mouseSens: 0.0022,
  headMultiplier: 2,
  // Staff: one big 2s overhand swing — wind-up, a tense pause, a fast strike (hits at hitAt), then recovery
  staff:     { min: 10, max: 10, cooldown: 2.0, range: 4.2, swingTime: 2.0, windUp: 1.0, hold: 0.15, strike: 0.25, hitAt: 1.33 },
  // Teleport: hold the key 3s, release to blink 10m in the direction you face. Released early = fizzles.
  teleport:  { castTime: 3.0, distance: 10, cooldown: 30, mana: 10, color: 0xc77dff, name: 'Teleport' },
  fireball:  { castTime: 2.0, min: 20, max: 30, cooldown: 1.0, mana: 10, speed: 70, color: 0xff6a1a, name: 'Fireball' },
  lightning: { castTime: 2.0, min: 28, max: 38, cooldown: 4.0, mana: 10, color: 0xcfeaff, name: 'Lightning' },
  heal:      { castTime: 1.5, min: 30, max: 45, cooldown: 8.0, mana: 10, color: 0x55ff88, name: 'Heal' },
  // Shield spell: instant cast, translucent circle in front of the caster
  shield:    { duration: 1.5, cooldown: 20, mana: 15, reduction: 0.95, color: 0x66ccff, name: 'Shield' },
  // Clone: instant. A copy appears beside the caster for 5s, moving opposite to her and copying everything else she does
  clone:     { duration: 5, cooldown: 60, mana: 20, color: 0x9a8cff, name: 'Clone' },
  // Warrior's shield (hold Block): stops any frontal attack, physical or magic, down to 1 damage.
  // Every block costs it 5 of its 100 hit points — the 20th block breaks it for the rest of the round.
  warShield: { hp: 100, costPerBlock: 5, damageTaken: 1 },
  // Warrior gear: sheathing/drawing the sword or stowing/readying the shield takes `time` seconds (one at a time);
  // each one put away makes him `speedBonus` faster
  gear: { time: 2, speedBonus: 0.15 },
  // Warrior sword (LMB / F): quick swings, no cooldown, 1 stamina each. Combo: overhand → backhand (within backWindow s)
  // → stab (within stabWindow s, and stabTotal s of the first swing). chainAt = earliest the next swing can follow.
  sword: { time: 0.42, hitAt: 0.16, chainAt: 0.2, stamina: 1, backWindow: 1, stabWindow: 2, stabTotal: 3, over: [8, 12], back: [8, 12], stab: [12, 16] },
  shieldHoldStaminaPerSec: 0.5,   // holding the shield up (RMB) costs 1 stamina every 2 seconds
  // Warrior skills (cost stamina instead of mana)
  bash:      { name: 'Shield Bash', stamina: 15, cooldown: 8,  time: 0.45, hitAt: 0.18, range: 2.6, min: 8, max: 12, stun: 1.2, lunge: 7 },
  charge:    { name: 'Charge',      stamina: 20, cooldown: 12, time: 0.7,  speed: 15, min: 10, max: 15, stun: 0.6, knock: 11 },
  warCry:    { name: 'War Cry',     stamina: 10, cooldown: 25, time: 0.6,  buff: 6, damageMult: 1.3, radius: 8, slow: 3, slowMult: 0.6 },
  whirlwind: { name: 'Whirlwind',   stamina: 25, cooldown: 10, time: 1.2,  ticks: [0.2, 0.6, 1.0], radius: 3.6, min: 6, max: 8, moveMult: 0.6 },
  throwAxe:  { name: 'Throw Axe',   stamina: 10, cooldown: 6,  time: 0.45, releaseAt: 0.22, speed: 32, gravity: 6, min: 15, max: 22 },
  block: {
    moveMult: 0.5,             // move speed while staff-blocking
    staffMin: 0.30, staffMax: 0.60,   // staff blocks 30–60% of damage
  },
  spellRange: 120,
  // Healing potion (quick bar): instant, the empty bottle gets dropped on the ground
  healPotion: { min: 25, max: 37, perRound: 3, bottleLife: 10 },
  manaPotion: { min: 25, max: 37, perRound: 3 },
  refreshPotion: { perRound: 3 },   // restores stamina to full
  // Explosion potion: shake it up (fuse starts), then it's thrown — explodes on hitting a character/pillar/wall or when the fuse runs out

function updateParticles(dt) {

    p.vel.y -= p.gravity * dt;

// Water shield textures (made once): a deep-water disc with caustic light, and a spiral swirl of foam

// Fireball projectiles (hit already decided at fire time — hitscan; this is the visual)
const projectiles = [];

}
// Fireball exploding on a target: fireball-coloured blast, rising embers, smoke, shockwave ring
function fireballExplosion(pos) {
  burst(pos, 0xff6a1a, 60, 11, 0.9, 0.7, 3);
  burst(pos, 0xffd27a, 30, 6, 1.3, 0.4, 0);
  burst(pos, 0xff2a00, 24, 14, 0.5, 0.5, 6);
  for (let i = 0; i < 14; i++) spawnParticle({ pos: pos.clone().add(randDir().multiplyScalar(0.4)), vel: randDir().multiplyScalar(1.2).add(new V3(0, 1.8, 0)), color: 0x3a2a24, life: rand(0.8, 1.3), size: 0.9, endSize: 1.8, opacity: 0.55, smoke: true });
  flash(pos, 0xff7a2a, 140, 0.55);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.2, 0.45, 40), new THREE.MeshBasicMaterial({ color: 0xffa040, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
  ring.position.copy(pos); ring.lookAt(camera.position); scene.add(ring);
  let t = 0;
  (function grow() {
    t += 1 / 60; ring.scale.setScalar(1 + t * 14); ring.material.opacity = Math.max(0, 0.9 - t * 3);
    if (t < 0.3) requestAnimationFrame(grow); else { scene.remove(ring); ring.geometry.dispose(); ring.material.dispose(); }
  })();
  playExplosion(pos, true);
}
function updateProjectiles(dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i]; p.t += dt;
    const k = Math.min(1, p.t / p.dur);
    p.mesh.position.lerpVectors(p.from, p.to, k);
    for (let j = 0; j < 2; j++) spawnParticle({ pos: p.mesh.position.clone().add(randDir().multiplyScalar(0.08)), vel: new V3(0, 0.6, 0), color: j ? 0xff3a00 : 0xffa030, life: 0.35, size: 0.55, endSize: 0.05 });
    if (p.sound) p.sound.update(p.mesh.position);
    if (k >= 1) {
      if (p.sound) p.sound.stop();
      if (p.hit) fireballExplosion(p.to);
      else {
        // missed: splashes against the wall / floor with a small whump
        burst(p.to, 0xff6a1a, 26, 7, 0.6, 0.55, 3);

// Lightning bolts
const bolts = [];
function jaggedPath(from, to, ampScale) {
  const dir = to.clone().sub(from); const len = dir.length(); dir.normalize();
  const a = new V3().crossVectors(dir, new V3(0, 1, 0)); if (a.lengthSq() < 1e-4) a.set(1, 0, 0); a.normalize();
  const b = new V3().crossVectors(dir, a).normalize();
  const n = clamp(Math.floor(len * 1.2), 6, 40);
  const amp = Math.min(1.0, 0.15 + len * 0.04) * ampScale;
  const path = new THREE.CurvePath(); let prev = from.clone();
  for (let i = 1; i <= n; i++) {
    const t = i / n; const p = from.clone().addScaledVector(dir, len * t);
    if (i < n) { const s = Math.sin(Math.PI * t) * amp; p.addScaledVector(a, rand(-1, 1) * s).addScaledVector(b, rand(-1, 1) * s); }
    path.add(new THREE.LineCurve3(prev, p)); prev = p;
  }
  return { path, n };
}
function rebuildBolt(bolt) {
  for (const ch of [...bolt.group.children]) { ch.geometry.dispose(); bolt.group.remove(ch); }
  const add = (from, to, w) => {
    const { path, n } = jaggedPath(from, to, w);
    bolt.group.add(new THREE.Mesh(new THREE.TubeGeometry(path, n * 2, 0.02 + 0.02 * w, 4), bolt.core));
    bolt.group.add(new THREE.Mesh(new THREE.TubeGeometry(path, n * 2, 0.12 * w, 6), bolt.glow));
  };
  add(bolt.from, bolt.to, bolt.w);
  for (let i = 0; i < bolt.branches; i++) {
    const s = new V3().lerpVectors(bolt.from, bolt.to, rand(0.2, 0.8));
    add(s, s.clone().add(randDir().multiplyScalar(rand(0.8, 2.2) * bolt.w)), 0.45 * bolt.w);
  }
}
function makeBolt(from, to, { life = 0.35, w = 1, branches = 3 } = {}) {
  const bolt = {
    group: new THREE.Group(), from: from.clone(), to: to.clone(), t: 0, life, regen: 0, w, branches,
    core: new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true }),
    glow: new THREE.MeshBasicMaterial({ color: 0x6fb8ff, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending, depthWrite: false }),
  };
  scene.add(bolt.group); rebuildBolt(bolt); bolts.push(bolt);
  return bolt;
}
// hit = it struck a character: sparks shower off them and little arcs jump away
function lightningBolt(from, to, hit = false) {
  makeBolt(from, to);
  flash(from, 0x9fd0ff, 30, 0.25); flash(to, 0xcfeaff, 70, 0.35);
  burst(to, 0x9fd0ff, 22, 8, 0.4, 0.4, 6);
  playThunder(from.clone().lerp(to, 0.5), to.distanceTo(camera.position));
  if (hit) lightningSparks(to);
}

// Spark streaks: short glowing lines that fly out, fall and fade
const sparks = [];
const sparkMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
function lightningSparks(pos) {
  const n = 46, geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 6), 3));
  geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(n * 6), 3));

  const pts = [];
  for (let i = 0; i < n; i++) {
    const v = randDir().multiplyScalar(rand(4, 13)); v.y = Math.abs(v.y) * 0.8 + rand(0, 3);   // mostly outward and up
    pts.push({ p: pos.clone().add(randDir().multiplyScalar(0.15)), v, life: rand(0.35, 0.8), age: 0, hot: Math.random() < 0.5 });
  }
  sparks.push({ lines, pts });
  // little arcs of electricity jumping off the target in different directions
  for (let i = 0; i < 5; i++) makeBolt(pos, pos.clone().add(randDir().multiplyScalar(rand(0.9, 2.0))), { life: rand(0.15, 0.3), w: 0.35, branches: 1 });

}
function updateSparks(dt) {
  for (let s = sparks.length - 1; s >= 0; s--) {
    const S = sparks[s], pa = S.lines.geometry.attributes.position.array, ca = S.lines.geometry.attributes.color.array;
    let alive = 0;
    S.pts.forEach((q, i) => {
      q.age += dt;
      const k = Math.max(0, 1 - q.age / q.life);
      if (k > 0) {
        alive++;
        q.v.y -= 14 * dt; q.v.multiplyScalar(1 - dt * 1.5);

      }

      pa.set([q.p.x, q.p.y, q.p.z, tail.x, tail.y, tail.z], i * 6);

      ca.set([r, g, b, r * 0.3, g * 0.4, b * 0.7], i * 6);

    if (b.regen <= 0 && b.t < b.life * 0.7) { b.regen = 0.05; rebuildBolt(b); }

    }
  }
}

// Cuts one render out of its white background, splits off the legs, and describes how to place it in the world
async function buildView(dataUri, A) {
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = dataUri; });
  const W = img.naturalWidth, H = img.naturalHeight, s = W / 1600, N = W * H;
  const S = v => v * s;
  const src = document.createElement('canvas'); src.width = W; src.height = H;
  const ctx = src.getContext('2d', { willReadFrequently: true }); ctx.drawImage(img, 0, 0);
  const id = ctx.getImageData(0, 0, W, H), d = id.data;
  const minC = p => Math.min(d[p * 4], d[p * 4 + 1], d[p * 4 + 2]);
  const spread = p => Math.max(d[p * 4], d[p * 4 + 1], d[p * 4 + 2]) - minC(p);
  const bg = new Uint8Array(N), q = new Int32Array(N);
  const orb = A.orb || { x: -1e5, y: -1e5, r: 0 };   // only the sorceress renders have a magic orb to strip
  const ox = S(orb.x), oy = S(orb.y), or2 = S(orb.r) ** 2;
  const inOrb = (x, y) => (x - ox) ** 2 + (y - oy) ** 2 < or2;

  // 1) flood-fill the white background from the image border
  let qh = 0, qt = 0;
  const tryBg = p => { if (!bg[p] && minC(p) > 222 && spread(p) < 28) { bg[p] = 1; q[qt++] = p; } };
  for (let x = 0; x < W; x++) { tryBg(x); tryBg((H - 1) * W + x); }
  for (let y = 0; y < H; y++) { tryBg(y * W); tryBg(y * W + W - 1); }
  while (qh < qt) { const p = q[qh++], x = p % W; if (x > 0) tryBg(p - 1); if (x < W - 1) tryBg(p + 1); if (p >= W) tryBg(p - W); if (p < N - W) tryBg(p + W); }

  // 2) enclosed white pockets (e.g. between leg and staff) — only large pure-white regions
  const seen = new Uint8Array(N);
  const pocket = p => minC(p) > 238 && spread(p) < 14;
  for (let p0 = 0; p0 < N; p0++) {
    if (bg[p0] || seen[p0] || !pocket(p0) || inOrb(p0 % W, (p0 / W) | 0)) continue;
    qh = 0; qt = 0; q[qt++] = p0; seen[p0] = 1;
    while (qh < qt) {
      const p = q[qh++], x = p % W;
      const nb = [x > 0 ? p - 1 : -1, x < W - 1 ? p + 1 : -1, p - W, p + W];
      for (const n of nb) if (n >= 0 && n < N && !seen[n] && !bg[n] && pocket(n)) { seen[n] = 1; q[qt++] = n; }
    }
    if (qt >= 80 * s * s) for (let i = 0; i < qt; i++) bg[q[i]] = 1;
  }

  // 3) alpha: background clear, soften light edge pixels. The renders have a magic orb on the staff:
  //    strip its glow, sparkles and the glassy tip inside it, so the staff ends at its gnarled wooden knot.
  for (let p = 0; p < N; p++) {
    if (bg[p]) continue;
    const x = p % W, y = (p / W) | 0, dO = (x - ox) ** 2 + (y - oy) ** 2;
    if (dO > or2 * 2) continue;
    const i = p * 4, r = d[i], b = d[i + 2];
    if (dO < or2 ? r >= b + 12 : r >= b - 8) continue;   // warm wood and cloth wrap stay
    bg[p] = 1;                                            // glow, sparkle, glassy tip
  }
  let minX = W, minY = H, maxX = 0, maxY = 0;
  for (let p = 0; p < N; p++) {
    const x = p % W, y = (p / W) | 0;
    if (bg[p]) { d[p * 4 + 3] = 0; continue; }
    let a = 1;
    const edge = (x > 0 && bg[p - 1]) || (x < W - 1 && bg[p + 1]) || (p >= W && bg[p - W]) || (p < N - W && bg[p + W]);
    if (edge) a = clamp((255 - minC(p)) / 90, 0.2, 1);
    d[p * 4 + 3] = a * 255;
    if (a > 0.1) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
  }

  // 3a) cut the weapon (staff / sword) out along its centre line into its own piece that pivots at the grip
  //     for swings; the hand wrapped around it stays on the body and covers the pivot.
  //     pts: [x, y, half-width] chain (null = gap, where the weapon is hidden behind the body)
  const ST = A.staff;
  const spts = ST.pts.map(p => p && [S(p[0]), S(p[1]), S(p[2])]), sblobs = ST.blobs.map(([x, y, r]) => [S(x), S(y), S(r)]);
  const gx = S(ST.grip[0]), gy = S(ST.grip[1]), hr2 = S(ST.hand) ** 2;
  let sx0 = W, sy0 = H, sx1 = 0, sy1 = 0;
  for (const [x, y, w] of [...spts.filter(Boolean), ...sblobs, [ox, oy, S(orb.r)]]) { if (x < -1e4) continue; sx0 = Math.min(sx0, x - w); sx1 = Math.max(sx1, x + w); sy0 = Math.min(sy0, y - w); sy1 = Math.max(sy1, y + w); }
  sx0 = Math.max(0, Math.floor(sx0)); sy0 = Math.max(0, Math.floor(sy0)); sx1 = Math.min(W - 1, Math.ceil(sx1)); sy1 = Math.min(H - 1, Math.ceil(sy1));
  const sw = sx1 - sx0 + 1, sh = sy1 - sy0 + 1;
  const stc = document.createElement('canvas'); stc.width = sw; stc.height = sh;
  const stctx = stc.getContext('2d'), sti = stctx.createImageData(sw, sh);
  const onStaff = (x, y) => {
    if (inOrb(x, y)) return true;   // whatever is left where the old orb was belongs to the staff head
    for (const [bx, by, r] of sblobs) if ((x - bx) ** 2 + (y - by) ** 2 < r * r) return true;
    for (let i = 0; i < spts.length - 1; i++) {
      if (!spts[i] || !spts[i + 1]) continue;
      const [ax, ay, aw] = spts[i], [bx, by, bw] = spts[i + 1];
      const vx = bx - ax, vy = by - ay, t = clamp(((x - ax) * vx + (y - ay) * vy) / (vx * vx + vy * vy), 0, 1);
      const w = aw + (bw - aw) * t;
      if ((x - ax - vx * t) ** 2 + (y - ay - vy * t) ** 2 < w * w) return true;
    }
    return false;
  };
  const cut = new Uint8Array(sw * sh);
  for (let y = sy0; y <= sy1; y++) for (let x = sx0; x <= sx1; x++) {
    const p = y * W + x;
    if (!d[p * 4 + 3] || (x - gx) ** 2 + (y - gy) ** 2 < hr2 || !onStaff(x, y)) continue;
    const di = ((y - sy0) * sw + (x - sx0)) * 4;
    for (let c = 0; c < 4; c++) sti.data[di + c] = d[p * 4 + c];
    d[p * 4 + 3] = 0; cut[(y - sy0) * sw + (x - sx0)] = 1;
  }
  stctx.putImageData(sti, 0, 0);
  // Where the weapon lay across the body (e.g. a sword in front of the tunic), fill the hole it leaves by blending
  // the body colours either side of it along each row — so swinging it away doesn't leave a see-through gap
  if (ST.fillHoles) {
    // holes = blade pixels with body on both sides of them along the row (not where it stuck out past him)
    const todo = new Set();
    for (let y = sy0; y <= sy1; y++) for (let x = sx0; x <= sx1; x++) {
      if (!cut[(y - sy0) * sw + (x - sx0)]) continue;
      let x1 = x; while (x1 + 1 <= sx1 && cut[(y - sy0) * sw + (x1 + 1 - sx0)]) x1++;
      const L = y * W + x - 4, R = y * W + x1 + 4;
      if (x > 3 && x1 < W - 4 && x1 - x < S(170) && d[L * 4 + 3] > 200 && d[R * 4 + 3] > 200) for (let k = x; k <= x1; k++) todo.add(y * W + k);
      x = x1;
    }
    // …or with body above and below it in the column (where the blade crosses the hem / edge of the tunic)
    for (let x = sx0; x <= sx1; x++) for (let y = sy0; y <= sy1; y++) {
      if (!cut[(y - sy0) * sw + (x - sx0)]) continue;
      let y1 = y; while (y1 + 1 <= sy1 && cut[(y1 + 1 - sy0) * sw + (x - sx0)]) y1++;
      const T = (y - 4) * W + x, B = (y1 + 4) * W + x;
      if (y > 3 && y1 < H - 4 && y1 - y < S(120) && d[T * 4 + 3] > 200 && d[B * 4 + 3] > 200) for (let k = y; k <= y1; k++) todo.add(k * W + x);
      y = y1;
    }
    // grow the cloth in from the edges of each hole (averaging neighbours, with a touch of grain)
    for (let pass = 0; pass < 300 && todo.size; pass++) {
      const done = [];
      for (const p of todo) {
        let r = 0, g = 0, b = 0, n = 0;
        for (const q of [p - 1, p + 1, p - W, p + W, p - W - 1, p - W + 1, p + W - 1, p + W + 1]) {
          if (q < 0 || q >= N || todo.has(q) || d[q * 4 + 3] < 200) continue;
          r += d[q * 4]; g += d[q * 4 + 1]; b += d[q * 4 + 2]; n++;
        }
        if (n >= 2) done.push([p, r / n, g / n, b / n]);
      }
      if (!done.length) break;
      for (const [p, r, g, b] of done) {
        const j = (Math.random() - 0.5) * 10;
        d[p * 4] = clamp(r + j, 0, 255); d[p * 4 + 1] = clamp(g + j, 0, 255); d[p * 4 + 2] = clamp(b + j, 0, 255); d[p * 4 + 3] = 255;
        todo.delete(p);
      }
    }
  }
  // Paint in parts of the weapon hidden behind the body in the render (they show once it swings out)
  for (const [x0, y0, x1, y1, w] of ST.paint || []) {
    const a = [S(x0) - sx0, S(y0) - sy0], b = [S(x1) - sx0, S(y1) - sy0];
    stctx.lineCap = 'round';
    stctx.strokeStyle = '#8c9098'; stctx.lineWidth = S(w); stctx.beginPath(); stctx.moveTo(...a); stctx.lineTo(...b); stctx.stroke();
    stctx.strokeStyle = '#c4c8d0'; stctx.lineWidth = S(w) * 0.35; stctx.beginPath(); stctx.moveTo(...a); stctx.lineTo(...b); stctx.stroke();   // bright fuller
  }

  // 3a+) a held shield (warrior): cut the ellipse of the shield (and the fist gripping it) into its own piece
  //      so it can be raised in front of him to block
  let shc = null, shb = null;
  if (A.shield) {
    const SH = A.shield, ecx = S(SH.cx), ecy = S(SH.cy), erx = S(SH.rx + 6), ery = S(SH.ry + 6);
    const x0 = Math.max(0, Math.floor(ecx - erx)), x1 = Math.min(W - 1, Math.ceil(ecx + erx));
    const y0 = Math.max(0, Math.floor(ecy - ery)), y1 = Math.min(H - 1, Math.ceil(ecy + ery));
    shb = { x0, y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
    shc = document.createElement('canvas'); shc.width = shb.w; shc.height = shb.h;
    const sc = shc.getContext('2d'), si = sc.createImageData(shb.w, shb.h);
    // his fist / forearm over the shield stays on the body (so it isn't carried onto his back with the shield)
    // (one rectangle [x0, y0, x1, y1], or a list of them following the arm)
    const rects = !SH.hand ? [] : (Array.isArray(SH.hand[0]) ? SH.hand : [SH.hand]).map(r => r.map(S));
    const inHand = (x, y) => rects.some(r => x >= r[0] && x <= r[2] && y >= r[1] && y <= r[3]);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const p = y * W + x;
      if (!d[p * 4 + 3] || ((x - ecx) / erx) ** 2 + ((y - ecy) / ery) ** 2 > 1 || inHand(x, y)) continue;
      const di = ((y - y0) * shb.w + (x - x0)) * 4;
      for (let c = 0; c < 4; c++) si.data[di + c] = d[p * 4 + c];
      d[p * 4 + 3] = 0;
    }
    // …and the patch of shield it covered is filled in from the wood above and below it, column by column
    // (the planks run up and down, so this continues them across the gap)
    // (any other gap inside the shield's outline — e.g. background showing between arm and shield — is filled the same way)
    if (rects.length) {
      const at = (x, y) => ((y - y0) * shb.w + (x - x0)) * 4;
      const inShield = (x, y) => ((x - ecx) / S(SH.rx)) ** 2 + ((y - ecy) / S(SH.ry)) ** 2 <= 1;
      for (let x = x0; x <= x1; x++) {
        for (let y = y0; y <= y1; y++) {
          if (!inShield(x, y) || si.data[at(x, y) + 3] > 200) continue;
          let y2 = y; while (y2 + 1 <= y1 && inShield(x, y2 + 1) && si.data[at(x, y2 + 1) + 3] <= 200) y2++;
          let T = y - 1; while (T >= y0 && si.data[at(x, T) + 3] <= 200) T--;
          let B = y2 + 1; while (B <= y1 && si.data[at(x, B) + 3] <= 200) B++;
          const hasT = T >= y0, hasB = B <= y1;
          if (hasT || hasB) for (let k = y; k <= y2; k++) {
            const t = hasT && hasB ? (k - T) / (B - T) : hasT ? 0 : 1, di = at(x, k);
            for (let c = 0; c < 3; c++) si.data[di + c] = (hasT ? si.data[at(x, T) + c] : 0) * (1 - t) + (hasB ? si.data[at(x, B) + c] : 0) * t;
            si.data[di + 3] = 255;
          }
          y = y2;
        }
      }
    }
    sc.putImageData(si, 0, 0);
  }

  // 3a++) arms (warrior): cut each arm along its chain into a piece hinged at the shoulder; the torso showing
  //       where an arm lay across it is patched from the colours either side so moving the arm leaves no hole
  const armCuts = {};
  const inPoly = (P, x, y) => { let c = false; for (let i = 0, j = P.length - 1; i < P.length; j = i++) { const [xi, yi] = P[i], [xj, yj] = P[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; };
  const torso = A.arms && A.arms.torso ? A.arms.torso.map(([x, y]) => [S(x), S(y)]) : null;
  const holes = [];   // pixels an arm was cut from that lie over the torso
  for (const [name, AR] of Object.entries(A.arms || {})) {
    if (name === 'torso') continue;
    const P = AR.poly.map(([x, y]) => [S(x), S(y)]);
    const ax0 = Math.max(0, Math.floor(Math.min(...P.map(p => p[0])))), ax1 = Math.min(W - 1, Math.ceil(Math.max(...P.map(p => p[0]))));
    const ay0 = Math.max(0, Math.floor(Math.min(...P.map(p => p[1])))), ay1 = Math.min(H - 1, Math.ceil(Math.max(...P.map(p => p[1]))));
    const aw = ax1 - ax0 + 1, ah = ay1 - ay0 + 1;
    const c = document.createElement('canvas'); c.width = aw; c.height = ah;
    const cx2 = c.getContext('2d'), im = cx2.createImageData(aw, ah);
    for (let y = ay0; y <= ay1; y++) for (let x = ax0; x <= ax1; x++) {
      const p = y * W + x;
      if (!d[p * 4 + 3] || !inPoly(P, x, y)) continue;
      const di = ((y - ay0) * aw + (x - ax0)) * 4;
      for (let k = 0; k < 4; k++) im.data[di + k] = d[p * 4 + k];
      d[p * 4 + 3] = 0;
      if (torso && inPoly(torso, x, y)) holes.push(p);
    }
    cx2.putImageData(im, 0, 0);
    armCuts[name] = { canvas: c, x0: ax0, y0: ay0, w: aw, h: ah, pivot: [S(AR.pivot[0]), S(AR.pivot[1])], hand: AR.hand && [S(AR.hand[0]), S(AR.hand[1])] };
  }
  // with the arms cut out, nothing of the shield may stay on the body: clear what was left inside its outline
  // (the patch kept under the shield fist for the old flat shield)
  if (A.shield && A.arms) {
    const SH = A.shield, ecx = S(SH.cx), ecy = S(SH.cy), erx = S(SH.rx + 8), ery = S(SH.ry + 8);
    for (let y = Math.max(0, Math.floor(ecy - ery)); y <= Math.min(H - 1, Math.ceil(ecy + ery)); y++)
      for (let x = Math.max(0, Math.floor(ecx - erx)); x <= Math.min(W - 1, Math.ceil(ecx + erx)); x++)
        if (((x - ecx) / erx) ** 2 + ((y - ecy) / ery) ** 2 <= 1 && !(torso && inPoly(torso, x, y))) d[(y * W + x) * 4 + 3] = 0;
  }
  // drop small loose scraps left floating once the weapon / arms / shield were cut away (bits of crossguard etc.)
  if (A.arms) {
    const lab = new Int32Array(N), stack = new Int32Array(N);
    let id = 0;
    for (let p0 = 0; p0 < N; p0++) {
      if (lab[p0] || d[p0 * 4 + 3] < 40) continue;
      id++; let sp = 0, cnt = 0; stack[sp++] = p0; lab[p0] = id;
      const members = [];
      while (sp) {
        const p = stack[--sp], x = p % W; members.push(p); cnt++;
        for (const q of [x > 0 ? p - 1 : -1, x < W - 1 ? p + 1 : -1, p - W, p + W]) if (q >= 0 && q < N && !lab[q] && d[q * 4 + 3] >= 40) { lab[q] = id; stack[sp++] = q; }
      }
      if (cnt < 2500 * s * s) for (const p of members) d[p * 4 + 3] = 0;
    }
  }
  // fill the torso where an arm lay over it: grow inward from the surrounding tunic, averaging known neighbours
  // (with a little grain so it doesn't look airbrushed)
  if (holes.length) {
    const todo = new Set(holes);
    for (let pass = 0; pass < 400 && todo.size; pass++) {
      const done = [];
      for (const p of todo) {
        let r = 0, g = 0, b = 0, n = 0;
        for (const q of [p - 1, p + 1, p - W, p + W, p - W - 1, p - W + 1, p + W - 1, p + W + 1]) {
          if (q < 0 || q >= N || todo.has(q) || d[q * 4 + 3] < 200) continue;
          r += d[q * 4]; g += d[q * 4 + 1]; b += d[q * 4 + 2]; n++;
        }
        if (n >= 2) done.push([p, r / n, g / n, b / n]);
      }
      if (!done.length) break;
      for (const [p, r, g, b] of done) {
        const j = (Math.random() - 0.5) * 10;
        d[p * 4] = clamp(r + j, 0, 255); d[p * 4 + 1] = clamp(g + j, 0, 255); d[p * 4 + 2] = clamp(b + j, 0, 255); d[p * 4 + 3] = 255;
        todo.delete(p);
      }
    }
  }

  // 3b) cut the legs out as separate pieces, then erase them from the body below the skirt
  const legTop = S(A.legTop);
  const legRange = (leg, y) => { const yy = y / s; for (const [yMax, x0, x1] of leg.bands) if (yy < yMax) return [Math.round(S(x0)), Math.round(S(x1))]; return [0, 0]; };
  const legs = A.legs.map(leg => {
    const bx0 = Math.round(S(Math.min(...leg.bands.map(b => b[1])))), bx1 = Math.round(S(Math.max(...leg.bands.map(b => b[2]))));
    const by0 = Math.round(S(A.legOverlap)), lw = bx1 - bx0, lh = H - by0;
    const lc = document.createElement('canvas'); lc.width = lw; lc.height = lh;
    const lctx = lc.getContext('2d'), li = lctx.createImageData(lw, lh);
    for (let y = by0; y < H; y++) {
      const [x0, x1] = legRange(leg, y);
      for (let x = Math.max(bx0, x0); x < Math.min(bx1, x1); x++) {
        const si = (y * W + x) * 4, di = ((y - by0) * lw + (x - bx0)) * 4;
        for (let c = 0; c < 4; c++) li.data[di + c] = d[si + c];
      }
    }
    lctx.putImageData(li, 0, 0);
    return { canvas: lc, bx0, by0, lw, lh, pivotX: S(leg.pivotX), twin: !!leg.twin };
  });
  for (const leg of A.legs) for (let y = Math.ceil(legTop); y < H; y++) {
    const [x0, x1] = legRange(leg, y);
    for (let x = x0; x < x1; x++) d[(y * W + x) * 4 + 3] = 0;
  }
  ctx.putImageData(id, 0, 0);

  // 4) crop to the figure; every view is scaled so she stands the same height
  const pad = 4;
  minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad); maxX = Math.min(W - 1, maxX + pad); maxY = Math.min(H - 1, maxY + pad);
  const cw = maxX - minX + 1, ppm = S(A.feetY - A.topY) / FIGURE_H;
  const cx = S(A.centerX), feetY = S(A.feetY);
  // The body is split at the waist into an upper and a lower piece so crouching can fold her at the hips.
  // Each piece: texture, size, and its centre relative to the waist point (x from centerX, y up from the waist)
  const wy = Math.round(S(A.waistY)), waistH = (feetY - wy) / ppm;
  const bodyPart = (y0, y1) => {
    const h = y1 - y0 + 1, c = document.createElement('canvas'); c.width = cw; c.height = h;
    c.getContext('2d').drawImage(src, minX, y0, cw, h, 0, 0, cw, h);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return { tex: t, w: cw / ppm, h: h / ppm, offX: (minX + cw / 2 - cx) / ppm, offY: (wy - (y0 + h / 2)) / ppm };
  };
  const upper = bodyPart(minY, Math.min(maxY, wy + 3)), lower = bodyPart(wy, maxY);   // 3px overlap hides the seam
  // Leg piece: texture, size, geometry offset from its pivot, pivot position on the figure
  const legView = L => {
    const lt = new THREE.CanvasTexture(L.canvas); lt.colorSpace = THREE.SRGBColorSpace;
    return {
      tex: lt, w: L.lw / ppm, h: L.lh / ppm,
      cx: (L.bx0 + L.lw / 2 - L.pivotX) / ppm, cy: (legTop - (L.by0 + L.lh / 2)) / ppm,
      px: (L.pivotX - cx) / ppm, py: (feetY - legTop) / ppm,
    };
  };
  // A twin leg becomes two pieces sharing one cut-out: [near, far (darker, behind)]
  const legViews = legs.flatMap(L => { const v = legView(L); return L.twin ? [v, { ...v, far: true }] : [v]; });
  // Staff piece: geometry offset from the grip, grip position on the figure
  const stTex = new THREE.CanvasTexture(stc); stTex.colorSpace = THREE.SRGBColorSpace; stTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const staff = {
    tex: stTex, w: sw / ppm, h: sh / ppm,
    cx: (sx0 + sw / 2 - gx) / ppm, cy: (gy - (sy0 + sh / 2)) / ppm,
    px: (gx - cx) / ppm, py: (feetY - gy) / ppm,
    swing: ST.swing, block: ST.block, inFront: !!ST.inFront,
    // warrior: where the sword goes when sheathed (top of the scabbard on his hip)
    sheath: ST.sheath ? { x: (S(ST.sheath[0]) - cx) / ppm, y: (feetY - S(ST.sheath[1])) / ppm } : null,
  };
  // Arm pieces: geometry offset from the shoulder pivot, pivot position on the figure, hand position from the pivot
  const arms = {};
  for (const [name, a] of Object.entries(armCuts)) {
    const t = new THREE.CanvasTexture(a.canvas); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const [pxp, pyp] = a.pivot;
    arms[name] = {
      tex: t, w: a.w / ppm, h: a.h / ppm,
      cx: (a.x0 + a.w / 2 - pxp) / ppm, cy: (pyp - (a.y0 + a.h / 2)) / ppm,
      px: (pxp - cx) / ppm, py: (feetY - pyp) / ppm,
      hand: a.hand ? { x: (a.hand[0] - pxp) / ppm, y: (pyp - a.hand[1]) / ppm } : null,
    };
  }
  // Shield piece: centred on the shield; px/py = its centre on the figure; raise = how far it moves when blocking
  let shieldPiece = null;
  if (shc) {
    const t = new THREE.CanvasTexture(shc); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const SH = A.shield;
    shieldPiece = {
      tex: t, w: shb.w / ppm, h: shb.h / ppm,
      cx: (shb.x0 + shb.w / 2 - S(SH.cx)) / ppm, cy: (S(SH.cy) - (shb.y0 + shb.h / 2)) / ppm,
      px: (S(SH.cx) - cx) / ppm, py: (feetY - S(SH.cy)) / ppm,
      raiseX: S(SH.raise[0]) / ppm, raiseY: S(SH.raise[1]) / ppm, restZ: SH.restZ, upZ: SH.upZ,
      // slung on his back (put away)
      backX: S(SH.back[0]) / ppm, backY: S(SH.back[1]) / ppm, backZ: SH.backZ, backScaleX: SH.backScaleX,
    };
  }
  return {
    upper, lower, waistH, side: A.side || 0, staff, shield: shieldPiece, arms,
    shieldTexCanvas: shc,   // the cut-out shield image (used to paint the warrior's 3D shield)
    // where the spell glow sits: the staff head / sword tip
    orbX: (S(A.tip ? A.tip[0] : orb.x) - cx) / ppm, orbY: (feetY - S(A.tip ? A.tip[1] : orb.y + 140)) / ppm,
    legs: legViews,
  };
}

async function buildArt(spec, images) {
  const out = {};
  for (const key of Object.keys(spec)) out[key] = await buildView(images[key], spec[key]);
  return out;
}

class Sorceress {
  constructor({ name, orb, art }) {
    this.name = name;
    this.orbBase = new THREE.Color(orb);

    // root (position + facing) -> billboard (turns to camera) -> fall (death, squash; pivots at feet)
    //   -> pivot (roll spin / lean; pivots at waist) -> inner -> art planes
    this.root = new THREE.Group();
    this.billboard = new THREE.Group(); this.root.add(this.billboard);
    this.fall = new THREE.Group(); this.billboard.add(this.fall);
    this.pivot = new THREE.Group(); this.pivot.position.y = 0.9; this.fall.add(this.pivot);
    this.inner = new THREE.Group(); this.inner.position.y = -0.9; this.pivot.add(this.inner);

    this.setArt(art);

    // Glow drawn over the art's orb — changes color while charging a spell
    this.orbGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: orb, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
    this.orbLight = new THREE.PointLight(orb, 3, 6, 2); this.orbGlow.add(this.orbLight);
    scene.add(this.orbGlow);

    // Shield spell: a translucent, spinning disc of water standing in front of her —
    // a deep-water body and a counter-rotating swirl of foam, a wobbling rim, and a ripple ring for hits
    const { body: waterBody, swirl: waterSwirl } = waterTextures();
    const wMat = (map, opacity, additive) => new THREE.MeshBasicMaterial({ map, transparent: true, opacity, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false });
    this.shield = new THREE.Group();
    this.shield.position.set(0, 1.0, -0.75); this.shield.visible = false; this.root.add(this.shield);
    this.shieldMat = wMat(waterBody, 0.55, false);
    this.shieldWater = new THREE.Mesh(new THREE.CircleGeometry(0.95, 64), this.shieldMat); this.shield.add(this.shieldWater);
    this.shieldSwirl = new THREE.Mesh(new THREE.CircleGeometry(0.93, 64), wMat(waterSwirl, 0.7, true)); this.shieldSwirl.position.z = 0.005; this.shield.add(this.shieldSwirl);
    this.shieldRimMat = new THREE.MeshBasicMaterial({ color: 0xbff0ff, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
    this.shieldRim = new THREE.Mesh(new THREE.RingGeometry(0.9, 0.98, 72), this.shieldRimMat); this.shieldRim.position.z = 0.01; this.shield.add(this.shieldRim);
    this.shieldRipple = new THREE.Mesh(new THREE.RingGeometry(0.85, 0.95, 64), new THREE.MeshBasicMaterial({ color: 0xe6fbff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
    this.shieldRipple.position.z = 0.015; this.shield.add(this.shieldRipple);

    // Hitboxes (not billboarded)
    this.hb = new THREE.Group(); this.root.add(this.hb);
    this.bodyHB = new THREE.Mesh(new THREE.BoxGeometry(0.55, HEAD_Y - 0.18, 0.4), HB_MAT_BODY);
    this.bodyHB.position.set(0, (HEAD_Y - 0.18) / 2, 0); this.hb.add(this.bodyHB);
    this.headHB = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 8), HB_MAT_HEAD);
    this.headHB.position.set(0, HEAD_Y, 0); this.hb.add(this.headHB);
    this.bodyHB.userData = { owner: this, part: 'body' };
    this.headHB.userData = { owner: this, part: 'head' };
    this.hitboxes = [this.headHB, this.bodyHB];
    this.chestAnchor = new THREE.Object3D(); this.chestAnchor.position.set(0, 1.15, 0); this.hb.add(this.chestAnchor);

    this.root.scale.setScalar(CFG.avatarScale);   // art, legs, shield and hitboxes all scale together
    scene.add(this.root);
    this.vel = new V3(); this.rollDir = new V3();
    this.walkPhase = 0; this.gait = 0;
    this.reset(new V3(), 0);
  }

  // (Re)build the four directional views from a character's processed art (used to switch class)
  setArt(art) {
    this.art = art;
    if (this.shield3D) { this.root.remove(this.shield3D); this.shield3D = null; }   // rebuilt for the new class if it carries one
    if (this.views) for (const k in this.views) this.inner.remove(this.views[k].mesh);
    this.views = {};
    for (const key of Object.keys(art)) {
      const v = art[key];
      // view group (feet at its origin) → upper body hinged at the waist (bottom edge), lower body hinged at the waist (top edge), legs
      const mesh = new THREE.Group(); mesh.visible = key === 'front'; this.inner.add(mesh);
      const bodyPiece = (part) => {
        const m = new THREE.MeshBasicMaterial({ map: part.tex, alphaTest: 0.3, side: THREE.DoubleSide, toneMapped: false });
        m.userData.tint = 1;
        const g = new THREE.PlaneGeometry(part.w, part.h); g.translate(part.offX, part.offY, 0);
        const hinge = new THREE.Group(); hinge.position.y = v.waistH; mesh.add(hinge);
        const pm = new THREE.Mesh(g, m); pm.castShadow = true; hinge.add(pm);
        return { hinge, mat: m };
      };
      const upper = bodyPiece(v.upper), lower = bodyPiece(v.lower);
      const mat = upper.mat;
      // Staff: its own plane hinged at her grip (rides on the upper body), just behind it so her hand covers the pivot
      const st = v.staff;
      const staffMat = new THREE.MeshBasicMaterial({ map: st.tex, alphaTest: 0.3, side: THREE.DoubleSide, toneMapped: false });
      staffMat.userData.tint = 1;
      const sgeo = new THREE.PlaneGeometry(st.w, st.h); sgeo.translate(st.cx, st.cy, 0);
      // (a weapon held across the front of the body, like the warrior's sword, is drawn in front of it instead)
      const staffPivot = new THREE.Group(); staffPivot.position.set(st.px, st.py - v.waistH, st.inFront ? 0.006 : -0.005); upper.hinge.add(staffPivot);
      // sheathing: the sword turns point-down and slides to the scabbard (angle that points the blade straight down)
      const tipAngle = Math.atan2(v.orbY - st.py, v.orbX - st.px);

  reset(pos, yaw) {
    this.root.position.copy(pos); this.vel.set(0, 0, 0); this.yaw = yaw;

    this.dead = false; this.deathT = 0;
    this.onGround = true; this.rolling = false; this.rollT = 0; this.rollCd = 0;
    this.swingT = -1; this.swingHit = false;
    this.casting = null; this.charged = null;
    this.cooldowns = { fireball: 0, heal: 0, lightning: 0, shield: 0, teleport: 0, clone: 0, bash: 0, charge: 0, warCry: 0, whirlwind: 0, throwAxe: 0 };

    this.swingType = null; this.comboStep = 0; this.lastSwingAt = -99; this.comboStart = -99;   // warrior sword combo
    this.swordTotal = 0;                                          // weapon angle (shoulder + wrist)
    this.shieldAim = { x: 0, y: 0 };                              // where the raised shield is pushed (RMB + mouse), -1..1
    this.aimPitch = 0;                                            // where he's looking (raised shield follows it)
    this.stunT = 0; this.slowT = 0; this.warCryT = 0;             // status effects
    this.knock = new V3();                                        // knockback velocity (decays)
    this.potionCd = { heal: 0, mana: 0, refresh: 0, explosive: 0 }; this.drinking = null;
    this.shieldHP = CFG.warShield.hp; this.shieldBroken = false; this.shieldUpK = 0;   // warrior's shield

    this.crouching = false; this.crouchK = 0;  // crouchK eases 0 (standing) → 1 (crouched)

  headPos(out = new V3()) { return this.headHB.getWorldPosition(out); }

  useSkill(id) {

    if (this.stunT > 0) return 'You are stunned';
    if (this.gear) return `Busy ${gearVerb(this.gear)} your ${this.gear.item}`;
    if (this.skill) return `Already using ${CFG[this.skill.id].name}`;
    if (this.swingT >= 0 || this.drinking || this.rolling) return 'Finish what you\'re doing first';
    if (this.cooldowns[id] > 0) return `${C.name} on cooldown (${this.cooldowns[id].toFixed(1)}s)`;
    if (id === 'bash' && !this.hasShield) return this.shieldBroken ? 'Your shield is broken' : `Ready your shield first (${K('shieldGear')})`;
    if (id === 'whirlwind' && !this.swordReady) return `Draw your sword first (${K('swordGear')})`;

  // Instant cast — doesn't interrupt anything else she's doing

    this.mana -= c.mana; this.cooldowns.shield = c.cooldown; this.shieldT = c.duration;

  }

  startCast(spell) {
    // Spells can be started during any action (rolling, crouching, blocking, swinging, jumping) — except handling gear
    if (this.dead || this.gear || this.cooldowns[spell] > 0 || this.mana < CFG[spell].mana) return false;

  // Warrior sword combo: no cooldown, 1 stamina a swing. Overhand → backhand (within 1s) → stab (within 2s,

  swordSwing() {

    if (this.swingT >= 0 && this.swingT < C.chainAt) return false;   // the current swing hasn't landed yet
    if (this.stamina < C.stamina) return false;

    else if (this.comboStep === 2 && gap <= C.stabWindow && time - this.comboStart <= C.stabTotal) step = 3;
    else { step = 1; this.comboStart = time; }
    this.comboStep = step === 3 ? 0 : step;
    this.lastSwingAt = time;

  step(dt, input) {

    for (const k in this.cooldowns) this.cooldowns[k] = Math.max(0, this.cooldowns[k] - dt);
    if (this.dead) { input = NO_INPUT; this.deathT += dt; }

        if (V.fb) lrz += (i ? -1 : 1) * 0.12 * ck;                            // knees splay out a little

    if (this.drinking && this.drinking.kind === 'explosive') tilt += Math.sin(time * 55) * 0.045 + Math.sin(time * 37) * 0.025;   // shaking the potion up
    this.inner.position.y = -0.9 + Math.abs(Math.sin(this.walkPhase)) * 0.07 * amp * (1 - 0.6 * this.crouchK);
    if (!this.onGround) { const v = clamp(this.vel.y / CFG.jumpVel, -1, 1); sy = 1 + v * 0.06; sx = 1 - v * 0.04; }

      let lean;
      if (T < C.windUp) { const e = easeOut(T / C.windUp); staffAng = wind * e; lean = -0.14 * e; sy *= 1 + 0.035 * e; }
      else if (T < tStrike) { staffAng = wind + Math.sin(T * 70) * 0.025; lean = -0.14; sy *= 1.035; }

        const ph = p * Math.PI * 2 * 3;

// Straw-and-burlap training dummy on a wooden stand, sized to the character hitboxes (head at HEAD_Y)

    const r = ac.createOscillator(), rg = ac.createGain(), rt = t + 0.35;
    r.type = 'sine'; r.frequency.value = f;
    rg.gain.setValueAtTime(0.0001, rt); rg.gain.exponentialRampToValueAtTime(g, rt + 0.004); rg.gain.exponentialRampToValueAtTime(0.0001, rt + 0.6);
    r.connect(rg); rg.connect(out.g); r.start(rt); r.stop(rt + 0.65);
  }
}

function blockReduction(target, attacker) {
  if ((!target.shieldT && !target.blockType) || !attacker) return null;
  const to = attacker.root.position.clone().sub(target.root.position); to.y = 0;
  if (to.lengthSq() < 1e-6 || to.normalize().dot(target.forward()) < 0) return null;
  // warrior's raised shield: blocks what it's actually turned toward
  if (target.blockType === 'guard' && target.hasShield) {
    if (!target.shield3D) return { type: 'guard' };
    const n = target.shield3D.getWorldDirection(new V3()); n.y = 0; n.normalize();
    if (to.dot(n) > 0.2) return { type: 'guard' };
  }
  if (target.shieldT > 0) return { type: 'shield', r: CFG.shield.reduction };
  return { type: 'staff', r: rand(CFG.block.staffMin, CFG.block.staffMax) };
}

function dealDamage(target, amount, isHead, point, attacker) {
  if (target.dead || state !== 'playing') return;
  let dmg = isHead ? amount * CFG.headMultiplier : amount;
  if (attacker && attacker.warCryT > 0) dmg = Math.round(dmg * CFG.warCry.damageMult);   // war cry: hits harder
  const blk = blockReduction(target, attacker);
  if (blk && blk.type === 'guard') {
    // Warrior's shield takes the hit: he feels 1 damage, the shield loses 5 HP (and breaks at 0)
    dmg = CFG.warShield.damageTaken;
    target.shieldHP = Math.max(0, target.shieldHP - CFG.warShield.costPerBlock);
    const sp = shieldWorldPos(target);
    popText(sp.clone().add(new V3(0, 0.6, 0)), 'BLOCKED', 'blocked');
    for (let i = 0; i < 14; i++) spawnParticle({ pos: sp.clone().add(randDir().multiplyScalar(0.2)), vel: randDir().multiplyScalar(rand(1.5, 4)).add(new V3(0, 1.5, 0)), color: Math.random() < 0.6 ? 0x8a6038 : 0xd8d8e0, life: rand(0.3, 0.6), size: rand(0.08, 0.16), endSize: 0.03, gravity: 12, smoke: true });
    burst(sp, 0xffe2b0, 10, 4, 0.3, 0.25, 0);
    if (target.shieldHP <= 0) breakShield(target); else playShieldBlock(sp);
  } else if (blk) {
    const raw = dmg;
    dmg = Math.max(0, Math.round(raw * (1 - blk.r)));
    popText(point.clone().add(new V3(0, 0.7, 0)), blk.type === 'shield' ? 'SHIELDED' : `PARRIED ${Math.round(blk.r * 100)}%`, 'blocked');
    if (blk.type === 'shield') {
      // the water swallows the hit: ripple, splash of droplets, absorb sound
      target.shieldHitT = 0.25;
      const sp = target.shield.getWorldPosition(new V3()), out = target.forward().multiplyScalar(2.5);
      for (let i = 0; i < 26; i++) spawnParticle({ pos: sp.clone().add(randDir().multiplyScalar(0.4)), vel: randDir().multiplyScalar(rand(1, 3.5)).add(out).add(new V3(0, rand(1, 3), 0)), color: Math.random() < 0.5 ? 0x8fdcff : 0xd8f6ff, life: rand(0.4, 0.8), size: rand(0.12, 0.25), endSize: 0.04, gravity: 12 });
      burst(sp, 0x66ccff, 14, 3, 0.5, 0.35, 0);
      playAbsorb(sp);
    } else burst(target.orbPos(), 0xffffff, 16, 5, 0.25, 0.35, 4);
  }
  target.hp = Math.max(0, target.hp - dmg);
  if (dmg > 0) target.flashT = 0.18;
  if (target === player) {
    popText(point, `-${dmg}`, 'taken');
    $('vignette').style.transition = 'none'; $('vignette').style.opacity = isHead ? 0.9 : 0.55;
    requestAnimationFrame(() => { $('vignette').style.transition = 'opacity .5s'; $('vignette').style.opacity = 0; });
  } else {
    popText(point, `${dmg}`, isHead ? 'head' : 'dmg');
    if (isHead) popText(point.clone().add(new V3(0, 0.35, 0)), 'HEADSHOT', 'tag');
    showHitmarker(isHead);
  }
  target.sinceHit = 0;
  if (testMode && target.hp <= 0) {
    // nobody dies in Test mode: the dummy (or you) pops back to full health
    target.hp = CFG.maxHp;
    popText(target.headPos().add(new V3(0, 0.6, 0)), target === bot ? 'DUMMY RESET' : 'REVIVED', 'tag');
    return;
  }
  if (target.hp <= 0) {
    target.dead = true; target.deathT = 0; target.cancel(); target.swingT = -1;
    endRound(target === bot);
  }
}

let botEnabled = true;
const BRAIN_START = { strafeDir: 1, strafeT: 0, thinkT: 1, aimT: null, wantDist: 11, noLosT: 0, jumpT: 2, dodgeT: 0, blockT: 0, blockType: null };
const brain = { ...BRAIN_START };
function resetBrain() { Object.assign(brain, BRAIN_START); }

function updateBot(dt) {
  const input = { move: new V3(), jump: false, roll: false, block: null };
  const to = player.root.position.clone().sub(bot.root.position); to.y = 0;
  const dist = to.length() || 0.001; const dirTo = to.clone().divideScalar(dist);
  if (testMode) return input;   // the dummy just stands there
  if (!bot.dead) bot.yaw = lerpAngle(bot.yaw, Math.atan2(-to.x, -to.z), Math.min(1, dt * 8));
  if (bot.dead || player.dead || state !== 'playing' || !botEnabled) return input;

  brain.strafeT -= dt; brain.jumpT -= dt; brain.dodgeT -= dt;
  if (brain.strafeT <= 0) { brain.strafeDir = Math.random() < 0.7 ? -brain.strafeDir : brain.strafeDir; brain.strafeT = rand(0.8, 2.5); brain.wantDist = rand(7, 14); }
  const los = hasLOS(bot.headPos(), player.chestPos());
  brain.noLosT = los ? 0 : brain.noLosT + dt;

  const lowHp = bot.hp < CFG.maxHp * 0.35;
  let radial = 0;
  if (lowHp && bot.cooldowns.heal > 0) radial = -1;
  else if (dist > brain.wantDist + 1.5) radial = 1;
  else if (dist < brain.wantDist - 1.5) radial = -1;
  if (brain.noLosT > 1) radial = 1;
  const perp = new V3(-dirTo.z, 0, dirTo.x);
  input.move.addScaledVector(dirTo, radial).addScaledVector(perp, brain.strafeDir * 0.9);
  if (input.move.lengthSq() > 1) input.move.normalize();

  if (brain.jumpT <= 0) { input.jump = Math.random() < 0.5; brain.jumpT = rand(1.5, 4); }
  // Defend when the player is about to fire or swing: dodge-roll, shield or staff block
  const threat = player.charged || (player.casting && player.casting.t > CFG[player.casting.spell].castTime - 0.4) || (player.swingT >= 0 && dist < 4);
  if (brain.blockT > 0) {
    brain.blockT -= dt;
    if (!threat && brain.blockT > 0.25) brain.blockT = 0.25;   // threat passed: lower the block soon
    input.block = brain.blockType;                            // keeps casting / attacking below while blocking
  }
  else if (threat && brain.dodgeT <= 0) {
    brain.dodgeT = rand(0.8, 2);
    const r = Math.random();
    if (r < 0.3 && bot.rollCd <= 0) { input.roll = true; input.move.copy(perp).multiplyScalar(Math.random() < 0.5 ? 1 : -1); }
    else if (r < 0.55 && bot.cooldowns.shield <= 0 && bot.mana >= CFG.shield.mana) bot.castShield();
    else if (r < 0.75) { brain.blockType = 'staff'; brain.blockT = rand(0.6, 1.2); }
  }

  // Attacks
  if (dist < CFG.staff.range - 0.6 && !bot.charged && bot.swingT < 0 && !bot.blockType) {
    if (Math.random() < dt * 3) bot.startSwing();
  } else if (!bot.casting && !bot.charged) {
    brain.thinkT -= dt;
    if (brain.thinkT <= 0) {
      brain.thinkT = rand(0.3, 1.0);
      if (lowHp && bot.cooldowns.heal <= 0) bot.startCast('heal');
      else if (bot.cooldowns.lightning <= 0 && Math.random() < 0.45) bot.startCast('lightning');
      else if (bot.cooldowns.fireball <= 0) bot.startCast('fireball');
    }
  }
  if (bot.charged) {
    if (brain.aimT === null) brain.aimT = rand(0.2, 0.9);
    brain.aimT -= dt;
    if (brain.aimT <= 0 && los) { fireSpell(bot, bot.charged); brain.aimT = null; }
  } else brain.aimT = null;
  return input;
}

const KEY_NAMES = {
  Mouse0: 'LMB', Mouse1: 'MMB', Mouse2: 'RMB', Mouse3: 'Mouse 4', Mouse4: 'Mouse 5',

  Semicolon: ';', Quote: "'", Comma: ',', Period: '.', Slash: '/', CapsLock: 'Caps',

function keyName(code) {

  if (KEY_NAMES[code]) return KEY_NAMES[code];
  if (code.startsWith('Key')) return code.slice(3);
  if (code.startsWith('Digit')) return code.slice(5);
  if (code.startsWith('Numpad')) return 'Num ' + code.slice(6);
  return code;
}
const K = (action) => keyName(binds[action]);

const held = {};                                   // input code -> currently down
const isDown = (action) => !!held[binds[action]];
const actionsFor = (code) => ACTION_IDS.filter(a => binds[a] === code);

let jumpQueued = false, rollQueued = false;
let camYaw = 0, camPitch = -0.08;
const camForward = new V3();
let locked = false;
let rebinding = null, suppressClick = false;       // settings page key capture
const aim = { x: 0, y: 0 };                        // crosshair offset from screen center (px)
function resetAim() { aim.x = 0; aim.y = 0; }
// Hold-to-aim: with a spell charged, holding the attack button lets the mouse move the crosshair;
// letting go fires the spell at the crosshair, which then snaps back to center.
let aimHold = false;
function releaseAim(fire) {
  if (!aimHold) return;
  aimHold = false;
  if (fire && player.charged && state === 'playing' && !paused) {
    cloneDo(player, c => { if (c.charged) fireSpell(c, c.charged); });   // clone fires first, while the crosshair is still where she aimed
    fireSpell(player, player.charged);
  }
  resetAim();
}

function onPress(code) {
  held[code] = true;
  if (!locked) return;
  if (state === 'over' && code.startsWith('Mouse')) { restart(); return; }
  for (const a of actionsFor(code)) {
    if (a === 'toggleBot') botEnabled = !botEnabled;
    if (a === 'hitboxes') HB_MAT_BODY.visible = HB_MAT_HEAD.visible = !HB_MAT_BODY.visible;
    if (a === 'restart' && state !== 'menu') restart();
    if (state !== 'playing' || paused) continue;
    if (!classHas(a)) continue;   // another class's skill
    if (a === 'jump') jumpQueued = true;
    if (a === 'roll') { rollQueued = true; if (player.stamina < CFG.stamina.rollCost) toast(`Not enough stamina (roll costs ${CFG.stamina.rollCost})`); }
    if (a === 'fireball' || a === 'heal' || a === 'lightning' || a === 'teleport') tryCast(a);
    // staff swing (F) — or for the warrior, a sword swing on F or the left mouse button
    if (a === 'melee' || (a === 'attack' && player.isWarrior)) {
      if (player.startSwing()) cloneDo(player, c => c.startSwing());
      else if (player.gear) toast(`Busy ${gearVerb(player.gear)} your ${player.gear.item}`);
      else if (!player.swordReady) toast(`Your sword is sheathed — press ${K('swordGear')} to draw it`);
      else if (player.isWarrior && player.stamina < CFG.sword.stamina) toast('Not enough stamina to swing');
    }

    if (WARRIOR_SKILLS.includes(a)) { const err = player.useSkill(a); if (err) { toast(err); denySlot(a); } }

    if (a.startsWith('item')) useQuickItem(+a.slice(4) - 1);

function onRelease(code) {

}

    const classesOf = (a) => CLASS_SKILL_ACTIONS.includes(a) ? CLASSES.filter(c => c.skills && c.skills.includes(a)).map(c => c.id) : ['*'];

function updateCamera() {
