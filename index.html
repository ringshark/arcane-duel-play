const floaters = [];
function popText(pos, text, cls) {
  const el = document.createElement('div'); el.className = 'floater ' + cls; el.textContent = text;
  $('floaters').appendChild(el);
  floaters.push({ el, pos: pos.clone().add(new V3(rand(-0.2, 0.2), 0.1, rand(-0.2, 0.2))), t: 0, life: 1.0 });
}
function project(pos) {
  const v = pos.clone().project(camera);
  return { x: (v.x * 0.5 + 0.5) * innerWidth, y: (-v.y * 0.5 + 0.5) * innerHeight, vis: v.z < 1 && v.z > -1 };
}
function updateFloaters(dt) {
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i]; f.t += dt; f.pos.y += dt * 1.1;
    if (f.t >= f.life) { f.el.remove(); floaters.splice(i, 1); continue; }
    const s = project(f.pos);
    f.el.style.display = s.vis ? 'block' : 'none';
    f.el.style.transform = `translate(${s.x}px, ${s.y}px) translate(-50%, -50%) scale(${1 + Math.max(0, 0.3 - f.t)})`;
    f.el.style.opacity = 1 - Math.max(0, (f.t - 0.6) / 0.4);
  }
}
let hitTimer;
function showHitmarker(head) {
  const h = $('hitmarker'); h.classList.toggle('head', head); h.classList.add('show');
  clearTimeout(hitTimer); hitTimer = setTimeout(() => h.classList.remove('show'), 120);
}
let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.opacity = 0, 1200); }
function denySlot(spell) { const s = document.querySelector(`.slot[data-spell="${spell}"]`); s.classList.add('denied'); setTimeout(() => s.classList.remove('denied'), 300); }

const slotEls = {};
document.querySelectorAll('.slot').forEach(el => slotEls[el.dataset.spell] = { el, cd: el.querySelector('.cd'), txt: el.querySelector('.cdText') });

// Quick use bar: 10 item squares.
// A potion slot: { potion: 'heal' | 'mana' | 'refresh', icon, name, count }.
// Any other item: { icon, name, count, use: (who) => false to refuse }; then renderQuickItems().
const quickItems = Array(10).fill(null);
const itemEls = quickItems.map(() => {
  const el = document.createElement('div'); el.className = 'item';
  el.innerHTML = '<span class="key"></span><span class="icon"></span><span class="count"></span><div class="cd"></div><div class="cdText"></div>';
  $('items').appendChild(el);
  return el;
});
// Per-frame: potion cooldown sweep + seconds left on each square, highlight the one being drunk
function updateQuickItemsHUD() {
  quickItems.forEach((it, i) => {
    const el = itemEls[i], cd = it && it.potion ? player.potionCd[it.potion] : 0;
    el.querySelector('.cd').style.height = cd > 0 ? (cd / CFG.potionCooldown * 100) + '%' : '0%';
    el.querySelector('.cdText').textContent = cd > 0 ? Math.ceil(cd) : '';
    el.classList.toggle('drinking', !!(it && it.potion && player.drinking && player.drinking.kind === it.potion));
  });
}
function renderQuickItems() {
  quickItems.forEach((it, i) => {
    const el = itemEls[i];
    el.classList.toggle('filled', !!it);
    el.title = it ? it.name : 'Empty';
    el.querySelector('.icon').innerHTML = it ? it.icon : '';
    el.querySelector('.count').textContent = it && it.count !== undefined ? it.count : '';
  });
}
function flashItem(i, cls) { const el = itemEls[i]; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), 250); }
function useQuickItem(i) {
  const it = quickItems[i];
  if (!it) { toast(`Quick slot ${i + 1} is empty`); flashItem(i, 'denied'); return; }
  const consume = () => {
    if (it.count !== undefined && --it.count <= 0) { const j = quickItems.indexOf(it); if (j >= 0) quickItems[j] = null; }
    renderQuickItems();
  };
  if (it.potion) {
    // potions are used up when the 1s drink finishes
    const err = startDrinking(player, it.potion, consume);
    if (err) { toast(err); flashItem(i, 'denied'); return; }
    cloneDo(player, c => startDrinking(c, it.potion));   // the clone drinks / shakes one too (doesn't use up yours)
    flashItem(i, 'used');
    return;
  }
  if (it.use(player) === false) { flashItem(i, 'denied'); return; }   // use() can refuse
  flashItem(i, 'used');
  consume();
}
// Potion flask icons: [glass tint, outline, liquid, highlight]
const potionIcon = (glass, line, liquid, shine) => `<svg width="30" height="30" viewBox="0 0 32 32"><path d="M13 4h6v3h-1v5.2c4 1.3 7 5 7 9.3C25 26.7 20.9 30 16 30s-9-3.3-9-8.5c0-4.3 3-8 7-9.3V7h-1z" fill="${glass}" stroke="${line}" stroke-width="1.4"/><path d="M8.6 20h14.8c.2.5.3 1 .3 1.5 0 4.2-3.4 7-7.7 7s-7.7-2.8-7.7-7c0-.5.1-1 .3-1.5z" fill="${liquid}"/><ellipse cx="12.5" cy="22.5" rx="1.4" ry="2.4" fill="${shine}" opacity=".8"/><rect x="13.6" y="2" width="4.8" height="3.4" rx="1" fill="#8a5a2b"/></svg>`;
const HEAL_POTION_ICON = potionIcon('rgba(255,240,190,.35)', '#fff3c4', '#ffd21f', '#fff8c8');   // yellow
const MANA_POTION_ICON = potionIcon('rgba(190,220,255,.35)', '#d4e8ff', '#2a7bff', '#cfe6ff');   // blue
const REFRESH_POTION_ICON = potionIcon('rgba(255,200,195,.35)', '#ffd6d0', '#e0201a', '#ffd0c8');   // red
const EXPLOSIVE_POTION_ICON = potionIcon('rgba(220,190,255,.35)', '#e6d0ff', '#9a2bff', '#f0d8ff');   // purple
function stockQuickItems() {
  quickItems.fill(null);
  const t = `${CFG.potionDrinkTime}s to drink, ${CFG.potionCooldown}s cooldown`;
  quickItems[0] = { potion: 'heal', icon: HEAL_POTION_ICON, name: `Healing Potion — heals ${CFG.healPotion.min}–${CFG.healPotion.max} HP (${t})`, count: CFG.healPotion.perRound };
  quickItems[1] = { potion: 'mana', icon: MANA_POTION_ICON, name: `Mana Potion — restores ${CFG.manaPotion.min}–${CFG.manaPotion.max} mana (${t})`, count: CFG.manaPotion.perRound };
  quickItems[2] = { potion: 'refresh', icon: REFRESH_POTION_ICON, name: `Refresh Potion — restores stamina to full (${t})`, count: CFG.refreshPotion.perRound };
  const E = CFG.explosivePotion;
  quickItems[3] = { potion: 'explosive', icon: EXPLOSIVE_POTION_ICON, name: `Explosion Potion — shake (${E.shakeTime}s) and throw; explodes on impact or after ${E.fuse}s, ${E.min}–${E.max} dmg in a ${E.tiles}x${E.tiles} tile area. Crosshair height sets the throw distance (${CFG.potionCooldown}s cooldown)`, count: E.perRound };
  renderQuickItems();
}
stockQuickItems();
function updateHUD() {
  $('php').style.width = (player.hp / CFG.maxHp * 100) + '%';
  $('phpTxt').textContent = `${Math.ceil(player.hp)} / ${CFG.maxHp}`;
  $('ehp').style.width = (bot.hp / CFG.maxHp * 100) + '%';
  $('ehpTxt').textContent = `${Math.ceil(bot.hp)} / ${CFG.maxHp}`;
  for (const [c, id] of [[player, 'p'], [bot, 'e']]) {
    $(id + 'mp').style.width = (c.mana / CFG.maxMana * 100) + '%';
    $(id + 'mpTxt').textContent = `Mana ${Math.floor(c.mana)} / ${CFG.maxMana}`;
    $(id + 'sp').style.width = (c.stamina / CFG.maxStamina * 100) + '%';
    $(id + 'spTxt').textContent = `Stamina ${Math.floor(c.stamina)} / ${CFG.maxStamina}`;
  }
  $('npFill').style.width = (bot.hp / CFG.maxHp * 100) + '%';
  // Warrior: shield durability
  const hasShieldArt = !!player.art.front.shield;
  $('pshWrap').style.display = hasShieldArt ? '' : 'none';
  if (hasShieldArt) {
    $('psh').style.width = (player.shieldHP / CFG.warShield.hp * 100) + '%';
    $('psh').classList.toggle('low', player.shieldHP <= 25);
    $('pshTxt').textContent = player.shieldBroken ? 'Shield BROKEN' : `Shield ${player.shieldHP} / ${CFG.warShield.hp}`;
  }

  for (const s of ['fireball', 'heal', 'lightning', 'teleport']) {
    const cd = player.cooldowns[s], sl = slotEls[s];
    sl.cd.style.height = cd > 0 ? (cd / CFG[s].cooldown * 100) + '%' : '0%';
    sl.txt.textContent = cd > 0 ? cd.toFixed(1) : '';
    sl.el.classList.toggle('active', (player.casting && player.casting.spell === s) || player.charged === s);
  }
  const st = slotEls.staff;
  st.cd.style.height = (player.swingCd / CFG.staff.cooldown * 100) + '%';
  st.txt.textContent = player.swingCd > 0 ? player.swingCd.toFixed(1) : '';
  st.el.classList.toggle('active', player.swingT >= 0);

  const sh = slotEls.shield;
  sh.cd.style.height = (player.cooldowns.shield / CFG.shield.cooldown * 100) + '%';
  sh.txt.textContent = player.cooldowns.shield > 0 ? Math.ceil(player.cooldowns.shield) : '';
  sh.el.classList.toggle('active', player.shieldT > 0);
  slotEls.staffBlock.el.classList.toggle('active', player.blockType === 'staff' || player.blockType === 'guard');

  const cl = slotEls.clone;
  cl.cd.style.height = (player.cooldowns.clone / CFG.clone.cooldown * 100) + '%';
  cl.txt.textContent = player.cooldowns.clone > 0 ? Math.ceil(player.cooldowns.clone) : '';
  cl.el.classList.toggle('active', !!activeClone(player));

  // Warrior skill cooldowns (lit while in use / while the war cry buff lasts)
  if (player.isWarrior) for (const id of WARRIOR_SKILLS) {
    const s = slotEls[id], cd = player.cooldowns[id];
    s.cd.style.height = cd > 0 ? (cd / CFG[id].cooldown * 100) + '%' : '0%';
    s.txt.textContent = cd > 0 ? Math.ceil(cd) : '';
    s.el.classList.toggle('active', (player.skill && player.skill.id === id) || (id === 'warCry' && player.warCryT > 0));
  }
  // Warrior gear slots: what the key will do next, and a sweep while it's happening
  if (player.isWarrior) {
    for (const [slot, item, out, onLbl, offLbl] of [['gearSword', 'sword', player.swordOut, 'Sheathe', 'Draw'], ['gearShield', 'shield', player.shieldOut, 'Stow', 'Ready']]) {
      const s = slotEls[slot], g = player.gear && player.gear.item === item ? player.gear : null;
      s.el.querySelector('.label').textContent = item === 'shield' && player.shieldBroken ? 'Broken' : g ? (g.toOut ? offLbl : onLbl) + '…' : out ? onLbl : offLbl;
      s.cd.style.height = g ? ((1 - g.t / CFG.gear.time) * 100) + '%' : '0%';
      s.txt.textContent = g ? (CFG.gear.time - g.t).toFixed(1) : '';
      s.el.classList.toggle('active', !!g);
      s.el.style.opacity = !out && !g ? 0.6 : 1;
    }
  }

  // Crosshair follows the free-aim offset
  const ct = `translate(${aim.x}px, ${aim.y}px)`;
  $('crosshair').style.transform = ct; $('hitmarker').style.transform = ct;
  $('crosshair').classList.toggle('free', aimHold);

  const cb = $('castbar');
  if (player.casting) {
    const c = CFG[player.casting.spell]; const p = Math.min(1, player.casting.t / c.castTime);
    cb.style.display = 'block';
    $('castFill').style.width = (p * 100) + '%';
    $('castFill').style.background = '#' + SPELL_COLORS[player.casting.spell].getHexString();
    $('castLabel').textContent = player.casting.spell !== 'teleport' ? `Casting ${c.name}… ${(c.castTime - player.casting.t).toFixed(1)}s`
      : p < 1 ? `Hold ${K('teleport')} for Teleport… ${(c.castTime - player.casting.t).toFixed(1)}s (letting go now cancels)`
      : `TELEPORT READY — release ${K('teleport')}`;
  } else if (player.drinking) {
    const P = POTIONS[player.drinking.kind], t = player.drinking.t, T = potionTime(player.drinking.kind);
    cb.style.display = 'block';
    $('castFill').style.width = (Math.min(1, t / T) * 100) + '%';
    $('castFill').style.background = P.color;
    $('castLabel').textContent = `${P.verb || 'Drinking'} ${P.name}… ${Math.max(0, T - t).toFixed(1)}s`;
  } else if (player.gear) {
    const g = player.gear, T = CFG.gear.time;
    cb.style.display = 'block';
    $('castFill').style.width = (Math.min(1, g.t / T) * 100) + '%';
    $('castFill').style.background = g.item === 'sword' ? '#c4c8d0' : '#b8875a';
    $('castLabel').textContent = `${gearVerb(g)[0].toUpperCase() + gearVerb(g).slice(1)} ${g.item}… ${Math.max(0, T - g.t).toFixed(1)}s`;
  } else cb.style.display = 'none';
  updateQuickItemsHUD();
  const rm = $('readyMsg');
  if (player.charged) { rm.textContent = `${CFG[player.charged].name.toUpperCase()} READY — LEFT CLICK`; rm.style.color = '#' + SPELL_COLORS[player.charged].getHexString(); }
  else rm.textContent = '';

  const np = project(bot.headPos().add(new V3(0, 0.55, 0)));
  const npEl = $('nameplate');
  npEl.style.display = np.vis && !bot.dead ? 'block' : 'none';
  npEl.style.transform = `translate(${np.x - 60}px, ${np.y - 20}px)`;

  $('botStatus').innerHTML = `Opponent AI: <b style="color:${botEnabled ? '#6bff8f' : '#ff8a8a'}">${botEnabled ? 'ON' : 'OFF (training dummy)'}</b><br><b>${K('toggleBot')}</b> toggle AI`;
}

let state = 'menu';    // menu | countdown | playing | ending | over
let paused = false;
let countdownT = 0, bannerT = 0;

function setBanner(text) { const b = $('banner'); b.textContent = text; b.style.opacity = 1; }
// Dress the player as the chosen class (and relabel the weapon slots)
function applyClass() {
  const views = CLASS_VIEWS[selectedClass] || CLASS_VIEWS.sorceress;
  if (player.art !== views) player.setArt(views);
  const sword = selectedClass === 'warrior';
  slotEls.staff.el.querySelector('.label').textContent = sword ? 'Sword' : 'Staff';
  slotEls.staffBlock.el.querySelector('.label').textContent = sword ? 'Shield Block' : 'Staff Block';
  slotEls.staffBlock.el.querySelector('.icon').textContent = sword ? '🛡️' : '⚔️';
  // the ability bar only shows this class's own skills (potions live on the shared quick bar)
  for (const [slot, action] of Object.entries(SLOT_ACTIONS)) slotEls[slot].el.style.display = classHas(action) ? '' : 'none';
  if (typeof updateKeyLabels === 'function' && overlayKind === 'menu' && $('overlay').style.display !== 'none') showOverlay('menu');   // refresh the controls list
}
// ability-bar slot → the action that uses it
const SLOT_ACTIONS = { fireball: 'fireball', heal: 'heal', lightning: 'lightning', teleport: 'teleport', staff: 'melee', shield: 'shield', staffBlock: 'staffBlock', clone: 'clone', gearSword: 'swordGear', gearShield: 'shieldGear',
  bash: 'bash', charge: 'charge', warCry: 'warCry', whirlwind: 'whirlwind', throwAxe: 'throwAxe' };
// Can the player's class use this action? (non-skill actions — moving, jumping, potions, menus — are for everyone)
function classHas(action) {
  if (!CLASS_SKILL_ACTIONS.includes(action)) return true;
  const c = CLASSES.find(k => k.id === selectedClass);
  return !!(c && c.skills && c.skills.includes(action));
}
function restart() {
  clearExplosives();
  applyClass();
  player.reset(new V3(0, 0, 11), 0);
  // Test mode: the dummy stands 10m in front of you, facing you
  bot.reset(new V3(0, 0, testMode ? 1 : -11), Math.PI);
  setDummyMode(testMode);
  camYaw = 0; camPitch = -0.08;
  resetAim();
  resetBrain();
  stockQuickItems(); clearBottles(); clearAxes(); vanishClone(player, false); vanishClone(bot, false);
  paused = false;
  if (testMode) { state = 'playing'; setBanner('TRAINING'); bannerT = 1.2; }   // no countdown for practice
  else { state = 'countdown'; countdownT = 3; }
  hideOverlay();
}
// Back to the title screen from a pause
function toMainMenu() {
  testMode = false; setDummyMode(false);
  restart(); state = 'menu'; $('banner').style.opacity = 0;
  if (document.pointerLockElement) document.exitPointerLock();
  showOverlay('menu');
}
function endRound(won) {
  state = 'ending';
  setBanner(won ? 'VICTORY' : 'DEFEAT');
  setTimeout(() => { if (state === 'ending') { state = 'over'; showOverlay(won ? 'win' : 'lose'); } }, 1600);
}

let overlayKind = 'menu', settingsFrom = 'menu';

const portraits = {};
function classPortrait(id) {
  if (!CLASS_VIEWS[id]) return window.CLASS_ART[id];
  // playable classes: built from their in-game front view (legs, weapon, then the body pieces on top)
  if (!portraits[id]) {
    const v = CLASS_VIEWS[id].front, K = 240, rects = [];
    for (const L of v.legs) rects.push({ img: L.tex.image, w: L.w, h: L.h, x: L.px + L.cx, y: L.py + L.cy });
    rects.push({ img: v.staff.tex.image, w: v.staff.w, h: v.staff.h, x: v.staff.px + v.staff.cx, y: v.staff.py + v.staff.cy });
    for (const part of [v.lower, v.upper]) rects.push({ img: part.tex.image, w: part.w, h: part.h, x: part.offX, y: v.waistH + part.offY });
    for (const a of Object.values(v.arms || {})) rects.push({ img: a.tex.image, w: a.w, h: a.h, x: a.px + a.cx, y: a.py + a.cy });
    if (v.arms && v.arms.sword) rects.push({ img: v.staff.tex.image, w: v.staff.w, h: v.staff.h, x: v.staff.px + v.staff.cx, y: v.staff.py + v.staff.cy });   // sword over the arm
    if (v.shield) rects.push({ img: v.shield.tex.image, w: v.shield.w, h: v.shield.h, x: v.shield.px + v.shield.cx, y: v.shield.py + v.shield.cy });
    const x0 = Math.min(...rects.map(r => r.x - r.w / 2)), x1 = Math.max(...rects.map(r => r.x + r.w / 2));
    const y0 = Math.min(...rects.map(r => r.y - r.h / 2)), y1 = Math.max(...rects.map(r => r.y + r.h / 2));
    const c = document.createElement('canvas'); c.width = Math.ceil((x1 - x0) * K); c.height = Math.ceil((y1 - y0) * K);
    const g = c.getContext('2d');
    for (const r of rects) g.drawImage(r.img, (r.x - r.w / 2 - x0) * K, (y1 - (r.y + r.h / 2)) * K, r.w * K, r.h * K);
    portraits[id] = c.toDataURL('image/png');
  }
  return portraits[id];
}

// MAIN LOOP
// ============================================================
const clock = new THREE.Clock();
let time = 0;

function update(dt) {
  time += dt;
  // Countdown
  if (state === 'countdown') {
    countdownT -= dt;
    if (countdownT > 0) setBanner(Math.ceil(countdownT));
    else { state = 'playing'; setBanner('FIGHT!'); bannerT = 0.8; }
  } else if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').style.opacity = 0; }

  // Player input (movement is relative to where the camera faces)
  let pInput = NO_INPUT;
  if (state === 'playing') {
    const f = new V3(-Math.sin(camYaw), 0, -Math.cos(camYaw)), r = new V3(Math.cos(camYaw), 0, -Math.sin(camYaw));
    const move = new V3()
      .addScaledVector(f, (isDown('forward') ? 1 : 0) - (isDown('back') ? 1 : 0))
      .addScaledVector(r, (isDown('right') ? 1 : 0) - (isDown('left') ? 1 : 0));
    if (move.lengthSq() > 1) move.normalize();
    // block: E (staff / shield) — or for the warrior, holding the right mouse button raises the shield
    const block = (classHas('staffBlock') && isDown('staffBlock')) || (classHas('shieldUp') && isDown('shieldUp')) ? 'staff' : null;
    player.aimPitch = camPitch;
    // shield lowered: it goes back to centre for next time
    if (player.blockType !== 'guard') { player.shieldAim.x *= Math.max(0, 1 - dt * 10); player.shieldAim.y *= Math.max(0, 1 - dt * 10); }
    pInput = { move, jump: jumpQueued, roll: rollQueued, block, crouch: isDown('crouch') };
  }
  jumpQueued = rollQueued = false;
  if (aimHold && !player.charged) { aimHold = false; resetAim(); }   // spell cancelled or lost mid-aim
  if (player.casting && player.casting.spell === 'teleport' && !isDown('teleport')) { cloneDo(player, c => c.releaseTeleport()); player.releaseTeleport(); }
  if (!player.dead) player.yaw = camYaw; // her back always faces the camera

  const bInput = (MPNET && MPNET.host && MPNET.started) ? MPNET.hostInput(dt) : updateBot(dt);
  player.step(dt, pInput);
  bot.step(dt, bInput);
  updatePotions(player, dt); updatePotions(bot, dt);
  updateClone(player, pInput, dt); updateClone(bot, bInput, dt);
  // Test mode: the dummy heals back up 3s after it was last hit
  if (testMode) { bot.sinceHit += dt; if (bot.sinceHit > 3) bot.hp = Math.min(CFG.maxHp, bot.hp + 60 * dt); }

  // Character-vs-character push apart
  const a = player.root.position, b = bot.root.position;
  const dx = a.x - b.x, dz = a.z - b.z, d = Math.hypot(dx, dz), m = CFG.charRadius * 2;
  if (d < m && d > 1e-4 && Math.abs(a.y - b.y) < 1.6 && !player.dead && !bot.dead) {
    const push = (m - d) / 2;
    a.x += dx / d * push; a.z += dz / d * push; b.x -= dx / d * push; b.z -= dz / d * push;
  }

  player.animate(dt, time); bot.animate(dt, time);
  player.root.updateMatrixWorld(true); bot.root.updateMatrixWorld(true);
  animateClone(player, dt, time); animateClone(bot, dt, time);

  for (const br of braziers) {
    if (Math.random() < 0.7) spawnParticle({ pos: br.pos.clone().add(new V3(rand(-0.3, 0.3), 0, rand(-0.3, 0.3))), vel: new V3(rand(-0.2, 0.2), rand(1.2, 2.2), rand(-0.2, 0.2)), color: Math.random() < 0.5 ? 0xff7a20 : 0xffb050, life: rand(0.4, 0.7), size: 0.6, endSize: 0.1 });
    br.light.intensity = 26 + Math.sin(time * 13 + br.pos.x) * 4 + Math.random() * 3;
  }
  for (const f of flashLights) { if (f.t > 0) { f.t = Math.max(0, f.t - dt); f.l.intensity = f.peak * (f.t / f.dur); } else f.l.intensity = 0; }

  updateProjectiles(dt);
  updateBolts(dt);
  updateParticles(dt);
  updateBottles(dt);
  updateExplosives(dt);
  updateAxes(dt);
  updateStatusFx(player, time); updateStatusFx(bot, time);
}

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, clock.getDelta());
  if (MPNET && MPNET.guest && MPNET.started) MPNET.guestFrame(dt);
  else if (!paused && state !== 'menu') update(dt);
  if (MPNET && MPNET.host) MPNET.hostFrame(dt);
  // freeze looping sounds (fireball roar) while paused
  if (audioCtx) { if (paused && audioCtx.state === 'running') audioCtx.suspend(); else if (!paused && audioCtx.state === 'suspended') audioCtx.resume(); }
  else if (state === 'menu') { time += dt; camYaw += dt * 0.15; player.animate(dt, time); bot.animate(dt, time); }
  updateCamera();
  updateFloaters(paused ? 0 : dt);
  updateHUD();
  renderer.render(scene, camera);
}

let MPNET = null;
const MP_RELAY_KEY = 'arcaneRelay';
const MP_DEFAULT_RELAY = 'wss://arcane-duel-relay.mgring715.workers.dev';
function mpRelayBase() {

const va = (v) => [Math.round(v.x * 1000) / 1000, Math.round(v.y * 1000) / 1000, Math.round(v.z * 1000) / 1000];
const vv = (a) => new V3(a[0], a[1], a[2]);

function mpMakeCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = ''; for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

function mpSnapChar(c, lite = false) {
  const s = {
    p: va(c.root.position), v: va(c.vel), yaw: Math.round(c.yaw * 1000) / 1000,
    hp: Math.round(c.hp * 10) / 10, mp: Math.round(c.mana * 10) / 10, st: Math.round(c.stamina * 10) / 10,
    dead: c.dead ? 1 : 0, og: c.onGround ? 1 : 0, roll: c.rolling ? 1 : 0,
    swing: Math.round(c.swingT * 100) / 100, cast: c.casting ? [c.casting.spell, Math.round(c.casting.t * 100) / 100] : null,
    chg: c.charged, cds: c.cooldowns, skill: c.skill ? [c.skill.id, Math.round(c.skill.t * 100) / 100] : null,
    block: c.blockType, shT: Math.round(c.shieldT * 100) / 100, cr: Math.round(c.crouchK * 100) / 100,
    stun: Math.round(c.stunT * 100) / 100, slow: Math.round(c.slowT * 100) / 100, wc: Math.round(c.warCryT * 100) / 100,
    shHP: Math.round(c.shieldHP), shBr: c.shieldBroken ? 1 : 0, sw: c.swordOut ? 1 : 0, sho: c.shieldOut ? 1 : 0,
    gear: c.gear ? [c.gear.item, Math.round((c.gear.t || 0) * 100) / 100] : null,
    ap: Math.round(c.aimPitch * 1000) / 1000, sa: [Math.round(c.shieldAim.x * 100) / 100, Math.round(c.shieldAim.y * 100) / 100],
    drink: c.drinking ? [c.drinking.kind, Math.round(c.drinking.t * 100) / 100] : null, pcd: c.potionCd,
    cloneT: Math.round((c.cloneT || 0) * 10) / 10
  };
  if (!lite) { const cl = activeClone(c); s.clone = cl ? mpSnapChar(cl, true) : null; }
  return s;
}

function mpApplyChar(c, s, dt) {
  if (!s) return;
  // position / facing: smooth toward the snapshot (short lerp kills jitter)
  if (!c._mpT) { c._mpT = vv(s.p); c._mpYaw = s.yaw; c.root.position.copy(c._mpT); }
  else { c._mpT.copy(vv(s.p)); c._mpYaw = s.yaw; }
  const k = 1 - Math.exp(-dt * 22);
  c.root.position.lerp(c._mpT, k);
  c.yaw = lerpAngle(c.yaw, c._mpYaw, 1 - Math.exp(-dt * 22));
  c.vel.copy(vv(s.v));
  c.hp = s.hp; c.mana = s.mp; c.stamina = s.st;
  c.dead = !!s.dead; c.onGround = !!s.og; c.rolling = !!s.roll;
  c.swingT = s.swing; c.casting = s.cast ? { spell: s.cast[0], t: s.cast[1] } : null; c.charged = s.chg;
  c.cooldowns = s.cds;
  c.skill = s.skill ? { id: s.skill[0], t: s.skill[1], dir: c.forward(), hits: new Set(), done: false } : null;
  c.blockType = s.block; c.shieldT = s.shT; c.crouchK = s.cr;
  c.stunT = s.stun; c.slowT = s.slow; c.warCryT = s.wc;
  c.shieldHP = s.shHP; c.shieldBroken = !!s.shBr; c.swordOut = !!s.sw; c.shieldOut = !!s.sho;
  c.gear = s.gear ? { item: s.gear[0], t: s.gear[1] } : null;
  c.aimPitch = s.ap; c.shieldAim.x = s.sa[0]; c.shieldAim.y = s.sa[1];
  c.drinking = s.drink ? { kind: s.drink[0], t: s.drink[1] } : null;
  c.potionCd = s.pcd; c.cloneT = s.cloneT;
  if (s.clone !== undefined) {
    const cl = activeClone(c);
    if (s.clone && !cl) castClone(c);
    else if (!s.clone && cl) vanishClone(c, false);
    const cl2 = activeClone(c);
    if (s.clone && cl2) mpApplyChar(cl2, s.clone, dt);
  }
}

    snapTimer: 0, inputTimer: 0, lastSnap: null, snapCount: 0, started: false,
    guestItems: null, testMode: false,
    send(obj) { if (this.ws && this.ws.readyState === 1) { try { this.ws.send(JSON.stringify(obj)); } catch (_) {} } },

    hostGame(code) {
      this.cleanupPeer();
      this.code = code || mpMakeCode();
      mpPanel(); mpShowPanel();
      mpStatus('Opening room…');
      this.connect();
    },
    joinGame(code) {
      if (!code || code.length !== 4) { mpStatus('Enter the 4-letter room code.'); return; }
      this.cleanupPeer();
      this.code = code;
      mpPanel(); mpShowPanel();
      mpStatus('Joining room ' + code + '…');
      this.connect();
    },
    connect() {
      this.relay = mpRelayBase();
      if (!this.relay) { mpStatus('Set the relay URL first (from the Cloudflare setup).'); return; }
      let ws;
      try { ws = new WebSocket(this.relay + '/room/' + this.code + '?role=' + this.role); }
      catch (_) { mpStatus('Bad relay URL — check it and try again.'); return; }
      this.ws = ws; this.conn = ws;
      ws.onopen = () => {
        if (this.host) { $('mpCodeBox').style.display = 'block'; $('mpCode').textContent = this.code; mpStatus('Room open — give your friend this code, then wait for them to join.'); }
        else mpStatus('Connected to the relay — checking the room…');
      };
      ws.onmessage = (e) => {
        let msg; try { msg = JSON.parse(e.data); } catch (_) { return; }
        if (msg && msg.t && msg.t.indexOf('__') === 0) this.onControl(msg);
        else this.onData(msg);
      };
      ws.onclose = () => {
        if (this.linked || this.started) { mpStatus('Connection closed.'); this.onDisconnect(); }
        else if (this.guest) { if (!this.errShown) mpStatus('Could not join — check the code, and that the host opened the room first.'); }
        else mpStatus('Relay connection closed.');
      };
      ws.onerror = () => { if (!this.linked && !this.errShown) mpStatus('Relay connection error — check the relay URL.'); };
    },
    onControl(msg) {
      if (msg.t === '__peer') {
        if (msg.ev === 'joined' && this.host) { this.linked = true; mpStatus('Friend connected! Press START MATCH when ready.'); }
        else if (msg.ev === 'present' && this.guest) { this.linked = true; this.send({ t: 'hello', cls: selectedClass }); mpStatus('Connected! Waiting for the host to start the match…'); }
        else if (msg.ev === 'guest-here' && this.host) { this.linked = true; }
        else if (msg.ev === 'left') this.onDisconnect();
      } else if (msg.t === '__error') {
        this.errShown = true;
        if (msg.msg === 'no-host') mpStatus('Room not found — the host must open the room first.');
        else if (msg.msg === 'role-taken') mpStatus('That side of the room is already taken — close and reopen the panel, then try again.');
        else mpStatus('Relay error: ' + msg.msg);
      }
    },
    cleanupPeer() { try { if (this.ws) this.ws.close(); } catch (_) {} this.ws = null; this.conn = null; this.linked = false; this.errShown = false; this.started = false; },
    onDisconnect() {
      const wasStarted = this.started;
      this.cleanupPeer(); MPNET = null;
      toast('Multiplayer connection lost');
      if (wasStarted) toMainMenu(); else mpShowPanel();
    },
    onData(msg) {
      if (!msg || !msg.t) return;
      if (this.host) {
        if (msg.t === 'hello') {
          this.guestClass = msg.cls;
          bot.setArt(CLASS_VIEWS[msg.cls] || CLASS_VIEWS.sorceress);
          this.send({ t: 'welcome', cls: selectedClass });
          $('mpStartBox').style.display = 'block';
          mpStatus('Friend joined as ' + msg.cls + ' — press START MATCH!');
        }
        else if (msg.t === 'in') { this.pkt = msg; if (msg.aim) this.aimLive = { o: vv(msg.aim.o), d: vv(msg.aim.d) }; }
        else if (msg.t === 'ev') this.events.push(msg);
      } else {
        if (msg.t === 'welcome') { bot.setArt(CLASS_VIEWS[msg.cls] || CLASS_VIEWS.sorceress); }
        else if (msg.t === 'start') {
          bot.setArt(CLASS_VIEWS[msg.hostCls] || CLASS_VIEWS.sorceress);
          this.started = true;
          _restart();
          camYaw = Math.PI; camPitch = -0.08;   // the guest fights from the far spawn: face the host
          mpShowPanel(); mpStatus('Match starting!'); $('mpEnterBtn').style.display = 'block'; $('mpStartBox').style.display = 'none';
          if (this.testMode) { $('mpPanel').style.display = 'none'; hideOverlay(); }
        }
        else if (msg.t === 'snap') { this.lastSnap = msg; this.snapCount++; }
        else if (msg.t === 'fx') this.onFx(msg);
        else if (msg.t === 'end') this.onEnd(msg);
      }
    },
    onEnd(msg) {
      const won = !msg.hostWon;
      state = 'ending';
      setBanner(won ? 'VICTORY' : 'DEFEAT');
      setTimeout(() => { if (state === 'ending') { state = 'over'; showOverlay(won ? 'win' : 'lose'); } }, 1600);
    },
    onFx(msg) {
      if (msg.kind === 'fireball') _launchFireball(vv(msg.from), vv(msg.to), () => {}, msg.hit);
      else if (msg.kind === 'bolt') _lightningBolt(vv(msg.from), vv(msg.to), msg.hit);
      else if (msg.kind === 'hit') { const p = vv(msg.point); burst(p, 0xffffff, 10, 4, 0.25, 0.3, 2); popText(p, String(Math.round(msg.dmg)), msg.head ? 'crit' : 'dmg'); }
      else if (msg.kind === 'boom') mpBoomVisual(vv(msg.pos));
    },

    // ----- HOST -----
    sendStart() {
      this.guestItems = [CFG.healPotion.perRound, CFG.manaPotion.perRound, CFG.refreshPotion.perRound, CFG.explosivePotion.perRound];
      this.send({ t: 'start', hostCls: selectedClass, guestCls: this.guestClass });
      this.started = true;
    },
    hostFrame(dt) {
      if (!this.conn) return;
      this.snapTimer -= dt;
      if (this.snapTimer <= 0) {
        this.snapTimer = 0.05;
        this.send({ t: 'snap', state, cd: Math.round(countdownT * 100) / 100, A: mpSnapChar(player), B: mpSnapChar(bot) });
      }
    },
    hostInput(dt) {
      // apply queued guest action events first
      while (this.events.length) this.applyGuestEvent(this.events.shift());
      const g = this.pkt;
      if (bot.casting && bot.casting.spell === 'teleport' && !(g && g.tp)) { cloneDo(bot, c => c.releaseTeleport()); bot.releaseTeleport(); }
      if (!g) return { move: new V3(), jump: false, roll: false, block: null, crouch: false };
      if (!bot.dead) bot.yaw = g.yaw;
      bot.aimPitch = g.pitch;
      bot.shieldAim.x = g.sa[0]; bot.shieldAim.y = g.sa[1];
      return { move: new V3(g.mv[0], 0, g.mv[1]), jump: !!g.jump, roll: !!g.roll, block: g.block, crouch: !!g.crouch };
    },
    applyGuestEvent(ev) {
      if (ev.k === 'rematch') { restart(); return; }
      if (ev.k === 'fire') {
        const ray = { o: vv(ev.o), d: vv(ev.d) };
        this.aimQueue.push(ray, ray);
        cloneDo(bot, c => { if (c.charged) fireSpell(c, c.charged); });
        fireSpell(bot, ev.spell);
        return;
      }
      if (ev.k !== 'press') return;
      const a = ev.a, cls = this.guestClass || 'sorceress';
      if (CLASS_SKILL_ACTIONS.includes(a)) { const c = CLASSES.find(k => k.id === cls); if (!c || !(c.skills || []).includes(a)) return; }
      if (a === 'fireball' || a === 'heal' || a === 'lightning' || a === 'teleport') { if (bot.startCast(a)) cloneDo(bot, c => c.startCast(a)); }
      else if (a === 'melee' || (a === 'attack' && bot.isWarrior)) { if (bot.startSwing()) cloneDo(bot, c => c.startSwing()); }
      else if (a === 'swordGear' || a === 'shieldGear') { bot.toggleGear(a === 'swordGear' ? 'sword' : 'shield'); cloneDo(bot, c => c.toggleGear(a === 'swordGear' ? 'sword' : 'shield')); }
      else if (WARRIOR_SKILLS.includes(a)) bot.useSkill(a);
      else if (a === 'shield') { if (bot.castShield()) cloneDo(bot, c => c.castShield()); }
      else if (a === 'clone') castClone(bot);
      else if (a === 'cancel') { bot.cancel(); cloneDo(bot, c => c.cancel()); }
      else if (a.startsWith('item')) this.hostUseItem(+a.slice(4) - 1);
    },
    hostUseItem(i) {
      const kinds = ['heal', 'mana', 'refresh', 'explosive'];
      const kind = kinds[i]; if (!kind || !this.guestItems || this.guestItems[i] <= 0) return;
      const err = startDrinking(bot, kind, () => { this.guestItems[i]--; });
      if (!err) cloneDo(bot, c => startDrinking(c, kind));
    },

    // ----- GUEST -----
    guestPress(code) {
      if (state === 'over' && code.startsWith('Mouse')) { this.send({ t: 'ev', k: 'rematch' }); return; }
      for (const a of actionsFor(code)) {
        if (a === 'restart' && state !== 'menu') { this.send({ t: 'ev', k: 'rematch' }); return; }
        if (state !== 'playing' || paused) continue;
        if (!classHas(a)) continue;
        if (a === 'jump') jumpQueued = true;
        else if (a === 'roll') rollQueued = true;
        else if (a === 'attack' && player.charged) aimHold = true;
        else if (a === 'attack' && player.isWarrior) this.send({ t: 'ev', k: 'press', a });
        else if (a === 'fireball' || a === 'heal' || a === 'lightning' || a === 'teleport' || a === 'melee' ||
                 a === 'shield' || a === 'clone' || a === 'cancel' || a === 'swordGear' || a === 'shieldGear' ||
                 WARRIOR_SKILLS.includes(a) || a.startsWith('item')) this.send({ t: 'ev', k: 'press', a });
      }
    },
    guestFrame(dt) {
      time += dt;
      // build + send input at ~30Hz
      this.inputTimer -= dt;
      if (this.inputTimer <= 0 && this.started) {
        this.inputTimer = 1 / 30;
        const f = new V3(-Math.sin(camYaw), 0, -Math.cos(camYaw)), r = new V3(Math.cos(camYaw), 0, -Math.sin(camYaw));
        const move = new V3()
          .addScaledVector(f, (isDown('forward') ? 1 : 0) - (isDown('back') ? 1 : 0))
          .addScaledVector(r, (isDown('right') ? 1 : 0) - (isDown('left') ? 1 : 0));
        if (move.lengthSq() > 1) move.normalize();
        const block = (classHas('staffBlock') && isDown('staffBlock')) || (classHas('shieldUp') && isDown('shieldUp')) ? 'staff' : null;
        const ray = aimRay(player);
        this.send({ t: 'in', mv: [Math.round(move.x * 100) / 100, Math.round(move.z * 100) / 100], jump: jumpQueued, roll: rollQueued, block, crouch: isDown('crouch'),
          yaw: Math.round(camYaw * 1000) / 1000, pitch: Math.round(camPitch * 1000) / 1000,
          sa: [Math.round(player.shieldAim.x * 100) / 100, Math.round(player.shieldAim.y * 100) / 100], tp: isDown('teleport'),
          aim: { o: va(ray.origin), d: va(ray.dir) } });
        jumpQueued = rollQueued = false;
      }
      // apply latest snapshot
      const s = this.lastSnap;
      if (s) {
        if (s.state === 'countdown') { state = 'countdown'; setBanner(Math.ceil(s.cd)); }
        else if (s.state === 'playing' && state !== 'playing') { state = 'playing'; setBanner('FIGHT!'); bannerT = 0.8; }
        else if (s.state === 'playing') state = 'playing';
        mpApplyChar(player, s.B, dt);
        mpApplyChar(bot, s.A, dt);
      }
      if (state !== 'countdown' && bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').style.opacity = 0; }
      if (aimHold && !player.charged) { aimHold = false; resetAim(); }
      player.animate(dt, time); bot.animate(dt, time);
      player.root.updateMatrixWorld(true); bot.root.updateMatrixWorld(true);
      animateClone(player, dt, time); animateClone(bot, dt, time);
      for (const br of braziers) {
        if (Math.random() < 0.7) spawnParticle({ pos: br.pos.clone().add(new V3(rand(-0.3, 0.3), 0, rand(-0.3, 0.3))), vel: new V3(rand(-0.2, 0.2), rand(1.2, 2.2), rand(-0.2, 0.2)), color: Math.random() < 0.5 ? 0xff7a20 : 0xffb050, life: rand(0.4, 0.7), size: 0.6, endSize: 0.1 });
        br.light.intensity = 26 + Math.sin(time * 13 + br.pos.x) * 4 + Math.random() * 3;
      }
      for (const fl of flashLights) { if (fl.t > 0) { fl.t = Math.max(0, fl.t - dt); fl.l.intensity = fl.peak * (fl.t / fl.dur); } else fl.l.intensity = 0; }
      updateProjectiles(dt); updateBolts(dt); updateParticles(dt); updateBottles(dt); updateExplosives(dt);
      updateStatusFx(player, time); updateStatusFx(bot, time);
    }
  };
}

// ---------------- Seams (wraps around the game's own functions) ----------------
const _onPress = onPress;
onPress = function (code) {
  if (MPNET && MPNET.guest && MPNET.conn) { held[code] = true; if (!locked && !MPNET.testMode) return; MPNET.guestPress(code); return; }
  _onPress(code);
};
const _releaseAim = releaseAim;
releaseAim = function (fire) {
  if (MPNET && MPNET.guest && MPNET.started) {
    if (!aimHold) return;
    aimHold = false;
    if (fire && player.charged && state === 'playing' && !paused) {
      const r = aimRay(player);
      MPNET.send({ t: 'ev', k: 'fire', spell: player.charged, o: va(r.origin), d: va(r.dir) });
    }
    resetAim();
    return;
  }
  _releaseAim(fire);
};
const _aimRay = aimRay;
aimRay = function (char) {
  if (MPNET && MPNET.host && MPNET.started && char === bot) {
    if (MPNET.aimQueue.length) { const r = MPNET.aimQueue.shift(); return { origin: r.o.clone(), dir: r.d.clone(), near: 0.3 }; }
    if (MPNET.aimLive) return { origin: MPNET.aimLive.o.clone(), dir: MPNET.aimLive.d.clone(), near: 0.3 };
  }
  return _aimRay(char);
};
const _onSwingStrike = onSwingStrike;
onSwingStrike = function (char) {
  if (MPNET && MPNET.host && MPNET.started && char === bot) {
    const opp = player;
    if (opp.dead) return;
    const { origin, dir, near } = aimRay(bot);
    const res = resolveShot(origin, dir, 60, bot, near);
    if (res.point.distanceTo(bot.chestPos()) <= CFG.staff.range + 0.4) {
      if (res.target) { dealDamage(res.target, swingDamage(char), res.part === 'head', res.point, bot); burst(res.point, 0xffffff, 12, 4, 0.25, 0.3, 2); if (bot.isWarrior) swordClang(res.point); }
      else if (bot.isWarrior) swordClang(res.point, true);
    }
    return;
  }
  _onSwingStrike(char);
};
const _launchFireball = launchFireball;
launchFireball = function (from, to, onArrive, hit = false) {
  _launchFireball(from, to, onArrive, hit);
  if (MPNET && MPNET.host && MPNET.started) MPNET.send({ t: 'fx', kind: 'fireball', from: va(from), to: va(to), hit });
};
const _lightningBolt = lightningBolt;
lightningBolt = function (from, to, hit = false) {
  _lightningBolt(from, to, hit);
  if (MPNET && MPNET.host && MPNET.started) MPNET.send({ t: 'fx', kind: 'bolt', from: va(from), to: va(to), hit });
};
const _dealDamage = dealDamage;
dealDamage = function (target, amount, isHead, point, attacker) {
  _dealDamage(target, amount, isHead, point, attacker);
  if (MPNET && MPNET.host && MPNET.started && point) MPNET.send({ t: 'fx', kind: 'hit', point: va(point), dmg: amount, head: isHead ? 1 : 0 });
};
const _explodePotion = explodePotion;
explodePotion = function (pos, owner) {
  _explodePotion(pos, owner);
  if (MPNET && MPNET.host && MPNET.started) MPNET.send({ t: 'fx', kind: 'boom', pos: va(pos) });
};
const _restart = restart;
restart = function () {
  if (MPNET && MPNET.guest && MPNET.conn) { MPNET.send({ t: 'ev', k: 'rematch' }); return; }
  _restart();
  if (MPNET && MPNET.host && MPNET.conn) MPNET.sendStart();
};
const _endRound = endRound;
endRound = function (won) {
  _endRound(won);
  if (MPNET && MPNET.host && MPNET.conn) MPNET.send({ t: 'end', hostWon: won });
};
const _showOverlay = showOverlay;
showOverlay = function (kind) {
  _showOverlay(kind);
  if (kind === 'menu') setTimeout(mpMenuInject, 0);
};

// ---------------- Autotest / URL entry ----------------
window.__MPTEST = {
  net: () => MPNET,
  state: () => ({
    state, started: !!(MPNET && MPNET.started), linked: !!(MPNET && MPNET.linked), relay: MPNET ? MPNET.relay : null, snaps: MPNET ? MPNET.snapCount : 0,
    me: { p: va(player.root.position), hp: Math.round(player.hp), chg: player.charged },
    opp: { p: va(bot.root.position), hp: Math.round(bot.hp) }
  }),
  hold: (code, on) => { held[code] = on; },
  press: (code) => { if (MPNET && MPNET.guest) { held[code] = true; MPNET.guestPress(code); } },
  fire: () => { aimHold = !!player.charged; releaseAim(true); }
};
(function mpAutoStart() {
  const q = new URLSearchParams(location.search);
  if (!q.has('mp')) return;
  const code = (q.get('code') || 'TEST').toUpperCase();
  if (q.get('mp') === 'host') {
    MPNET = mpNewNet('host'); MPNET.testMode = true; MPNET.hostGame(code);
    const iv = setInterval(() => { if (MPNET && MPNET.linked && MPNET.guestClass && !MPNET.started) { restart(); clearInterval(iv); } }, 400);
  } else if (q.get('mp') === 'join') {
    MPNET = mpNewNet('guest'); MPNET.testMode = true; MPNET.joinGame(code);
  }
})();

player.reset(new V3(0, 0, 11), 0);
bot.reset(new V3(0, 0, -11), Math.PI);
applyClass();
updateKeyLabels();
showOverlay('menu');
frame();
</script>
</body>
